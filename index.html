<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Træning">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<title>Træning — Dashboard</title>
<script src="tp-core.js"></script>
<script src="tp-plan.js"></script>
<script src="tp-report.js"></script>
<script src="tp-sync.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap');
:root{
  --bg:#111318; --surface:#1a1d24; --surface2:#22262f; --border:#2e3240;
  --text:#f0ece4; --muted:#9aa3b2; --gold:#d4a843; --gold-dim:#9a7830;
  --sq:#4a90d9; --bp:#d4a843; --dl:#e05c4a; --green:#3db87a; --red:#e05c4a;
  --radius:14px; --safe-bottom:env(safe-area-inset-bottom,0px); --safe-top:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100%;overscroll-behavior:none;}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;}

.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(17,19,24,0.94); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:calc(10px + var(--safe-top)) 16px 10px;
}
.topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1280px; margin:0 auto; }
.topbar-title{font-size:22px;font-weight:900;letter-spacing:1px;text-transform:uppercase;line-height:1.1;}
.topbar-sub{font-size:var(--fs-xs);color:var(--muted);margin-top:1px;}

.profile-switch{
  display:inline-flex; gap:2px; padding:3px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-pill); flex-shrink:0;
}
.profile-btn{
  min-width:74px; min-height:36px; padding:6px 14px; border-radius:var(--r-pill); border:0;
  background:transparent; color:var(--muted); font-family:var(--font-disp);
  font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  cursor:pointer; transition:background var(--ease), color var(--ease);
}
.profile-btn:hover{ color:var(--text); }
.profile-btn.active{ background:var(--gold); color:var(--on-gold); }

main{
  padding:16px 16px calc(40px + var(--safe-bottom)); max-width:1280px; margin:0 auto;
  display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start;
}
.dash-sec{ min-width:0; }
.dash-sec > div:empty{ display:none; }

/* ── RESPONSIVT LAYOUT ──
   Mobil: én kolonne. Tablet: to kolonner. Desktop: 12-kolonne-gitter med
   "I dag" som bred hero og ugeplanen ved siden af kalenderen. */
@media (min-width:760px){
  .topbar{ padding-left:24px; padding-right:24px; }
  main{ padding:24px 24px 56px; gap:20px; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .dash-sec.wide, .dash-sec.s8, .dash-sec.s4{ grid-column:1 / -1; }
}
@media (min-width:1100px){
  main{ grid-template-columns:repeat(12,minmax(0,1fr)); gap:24px; }
  .dash-sec{ grid-column:span 6; }
  .dash-sec.wide{ grid-column:1 / -1; }
  .dash-sec.s8{ grid-column:span 8; }
  .dash-sec.s4{ grid-column:span 4; }
  .dash-sec.wide{ grid-column:1 / -1; }
}

.section-label{
  font-family:var(--font-disp); font-size:var(--fs-sm); font-weight:700;
  letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 2px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
details.dash-sec > summary.section-label{
  list-style:none; cursor:pointer; margin:0; padding:14px 4px; min-height:48px;
  border-bottom:1px solid var(--border); user-select:none;
}
details.dash-sec > summary.section-label::-webkit-details-marker{ display:none; }
details.dash-sec > summary.section-label::after{
  content:'+'; font-size:20px; line-height:1; color:var(--muted); font-weight:400; transition:transform var(--ease);
}
details.dash-sec[open] > summary.section-label::after{ content:'–'; }
details.dash-sec > summary.section-label:hover{ color:var(--text); }
details.dash-sec[open] > summary.section-label{ margin-bottom:12px; }

/* ── PRIMARY CARD ── */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden;
}
.card.primary{ border-color:var(--border-strong); }
.card.primary .card-head{ background:linear-gradient(0deg,transparent,rgba(212,168,67,0.05)); }
.card-head{
  padding:16px 18px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.card.secondary .card-head{ padding:14px 16px 10px; }
.disc-name{ font-size:24px; font-weight:900; text-transform:uppercase; letter-spacing:0.5px; line-height:1; }
.card.secondary .disc-name{ font-size:18px; }
.disc-icon{ font-size:22px; margin-right:6px; }
.week-pill{
  font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase; padding:5px 12px; border-radius:20px;
  border:1px solid var(--border); color:var(--gold); white-space:nowrap;
}
.card.secondary .week-pill{ font-size:var(--fs-xs); padding:3px 9px; color:var(--muted); }

.card-body{ padding:16px 18px 18px; }
.card.secondary .card-body{ padding:12px 16px 14px; }

.next-label{ font-size:var(--fs-xs); letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.next-day{ font-size:20px; font-weight:700; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; }
.card.secondary .next-day{ font-size:16px; }
.next-desc{ font-size:var(--fs-md); color:var(--text-2); margin-top:6px; line-height:1.5; }
.card.secondary .next-desc{ font-size:var(--fs-sm); }

.progress-wrap{ margin-top:14px; }
.progress-bar{ height:6px; background:var(--surface2); border-radius:4px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--gold); border-radius:4px; }
.progress-label{ font-size:var(--fs-xs); color:var(--muted); margin-top:5px; }

.card-more{ margin-top:10px; }
.card-more > summary{ list-style:none; cursor:pointer; font-size:var(--fs-sm); color:var(--muted); padding:6px 0; min-height:32px; display:flex; align-items:center; gap:6px; }
.card-more > summary::-webkit-details-marker{ display:none; }
.card-more > summary::before{ content:'▸'; font-size:11px; transition:transform var(--ease); }
.card-more[open] > summary::before{ transform:rotate(90deg); }
.card-more[open] > summary{ color:var(--text); }
.secondary-note{
  margin-top:10px; font-size:var(--fs-xs); color:var(--muted); font-style:italic;
  padding:8px 10px; background:var(--surface2); border-radius:8px; line-height:1.4;
}

.open-btn{
  display:flex; align-items:center; justify-content:center; min-height:46px; text-align:center; margin-top:16px; padding:10px 12px;
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  color:var(--text); text-decoration:none; font-family:'Barlow Condensed',sans-serif;
  font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
}
.card .open-btn{ margin-top:12px; min-height:42px; font-size:14px; }
.open-btn:hover{ border-color:var(--border-strong); filter:brightness(1.1); }

.rest-note{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--green);
  margin-top:4px;
}

.empty-card{
  background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);
  padding:20px 18px; text-align:center;
}
.empty-card .disc-name{ color:var(--muted); }
.empty-card p{ font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5; font-weight:300; }

/* ── EXAMPLE-DATA BADGE ── */
.example-badge{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--muted); border:1px dashed var(--border); border-radius:20px; padding:2px 8px; margin-left:8px;
  vertical-align:middle;
}
.section-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 16px 18px; margin-bottom:10px;
}
.section-card.example{ border-style:dashed; }
.section-card h3{
  font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;
}

/* ── OVERSIGT STAT GRID ── */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-box{ background:var(--surface2); border-radius:10px; padding:10px 12px; }
.stat-box .v{ font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; line-height:1.1; }
.stat-box .l{ font-size:var(--fs-xs); color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; }
.stat-box .trend-up{ color:var(--green); } .stat-box .trend-down{ color:var(--dl); }

/* ── LIFT CARDS ── */
.lift-row{ display:flex; gap:8px; margin-bottom:10px; }
.lift-box{ flex:1; background:var(--surface2); border-radius:10px; padding:10px 8px; text-align:center; }
.lift-box .name{ font-size:var(--fs-xs); color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.lift-box .e1rm{ font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; color:var(--gold); margin-top:2px; }
.lift-box .sub{ font-size:var(--fs-xs); color:var(--muted); margin-top:2px; }
.lift-box .pr-tag{ font-size:11px; color:var(--green); margin-top:3px; }

/* ── MUSCLE HEATMAP ── */
.heat-grid{ display:flex; flex-direction:column; gap:6px; }
.heat-row{ display:flex; align-items:center; gap:8px; }
.heat-label{ font-size:var(--fs-xs); color:var(--muted); width:78px; flex-shrink:0; }
.heat-bar-bg{ flex:1; height:14px; background:var(--surface2); border-radius:7px; overflow:hidden; position:relative; }
.heat-bar-fill{ height:100%; border-radius:7px; }
.heat-count{ font-size:var(--fs-xs); color:var(--text); width:34px; text-align:right; flex-shrink:0; }

/* ── RECOVERY GAUGE ── */
.readiness-wrap{ display:flex; align-items:center; gap:14px; }
.readiness-circle{
  width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:900; flex-shrink:0; border:3px solid;
}
.readiness-detail{ font-size:var(--fs-sm); color:var(--muted); line-height:1.6; }
.readiness-detail b{ color:var(--text); }

/* ── PR LIST / GOALS ── */
.pr-list, .goal-list{ display:flex; flex-direction:column; gap:8px; }
.pr-row, .goal-row{
  display:flex; justify-content:space-between; align-items:center; background:var(--surface2);
  border-radius:8px; padding:9px 12px;
}
.pr-row .lbl, .goal-row .lbl{ font-size:var(--fs-sm); color:var(--muted); }
.pr-row .val{ font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; color:var(--gold); }
.goal-bar-bg{ flex:1; height:8px; background:var(--surface); border-radius:4px; margin:0 10px; overflow:hidden; }
.goal-bar-fill{ height:100%; background:var(--gold); border-radius:4px; }
.goal-nums{ font-size:var(--fs-xs); color:var(--muted); white-space:nowrap; }

/* ── INSIGHTS ── */
.insight-item{
  display:flex; gap:8px; font-size:var(--fs-sm); color:var(--text); line-height:1.5; margin-bottom:8px;
}
.insight-item:last-child{ margin-bottom:0; }
.insight-dot{ color:var(--gold); flex-shrink:0; }

/* ── DEFERRED LIST ── */
.deferred-note{
  font-size:var(--fs-xs); color:var(--muted); line-height:1.6; margin-top:6px;
}

/* ── I DAG (hero) ── */
.today-hero{ background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius); overflow:hidden; }
.today-head{ padding:16px 18px 12px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.today-head h2{ font-size:var(--fs-2xl); font-weight:900; text-transform:uppercase; letter-spacing:.5px; line-height:1.1; }
.today-date{ font-size:var(--fs-sm); color:var(--muted); }
.today-items{ display:grid; gap:1px; background:var(--border); border-top:1px solid var(--border); }
@media (min-width:760px){ .today-items.two{ grid-template-columns:1fr 1fr; } }
.today-item{ background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.today-kind{ font-size:var(--fs-xs); letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.today-name{ font-family:var(--font-disp); font-size:var(--fs-2xl); font-weight:700; text-transform:uppercase; line-height:1.15; }
.today-meta{ font-size:var(--fs-md); color:var(--text-2); line-height:1.5; }
.today-meta b{ color:var(--text); }
.today-actions{ margin-top:8px; display:flex; flex-wrap:wrap; gap:8px; }
.today-btn{
  display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:10px 20px; border-radius:var(--r-md);
  font-family:var(--font-disp); font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase; text-decoration:none;
  background:var(--gold); color:var(--on-gold); border:1px solid var(--gold); transition:filter var(--ease);
}
.today-btn:hover{ filter:brightness(1.08); }
.today-btn.ghost{ background:transparent; color:var(--text); border-color:var(--border-strong); }
.today-done{ color:var(--success); }
.today-warn{ display:flex; gap:10px; align-items:flex-start; padding:10px 18px; background:rgba(224,164,58,0.10); border-top:1px solid rgba(224,164,58,0.35); color:var(--text-2); font-size:var(--fs-sm); line-height:1.45; }
.today-warn a{ color:var(--gold); text-decoration:underline; text-underline-offset:2px; }
.today-rest{ padding:18px; color:var(--text-2); font-size:var(--fs-md); background:var(--surface); border-top:1px solid var(--border); }
@media (max-width:520px){ .today-btn{ width:100%; } }

/* ── UGESKEMA ── */
.week-grid{ display:flex; flex-direction:column; gap:6px; }

/* ── KALENDER ── */
.cal-nav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.cal-nav-btn{
  width:40px; height:40px; border-radius:8px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-size:16px; cursor:pointer; font-family:'Barlow Condensed',sans-serif;
}
.cal-title{ font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; text-transform:uppercase; }
/* Planlagte (fremtidige) dage: hul prik i stedet for udfyldt */
.week-day-row{
  display:grid; grid-template-columns:38px minmax(0,1fr) minmax(0,1fr); gap:10px 12px; align-items:start;
  background:var(--surface2); border-radius:var(--r-md); padding:10px 12px; border:1px solid transparent;
}
@media (max-width:520px){
  .week-day-row{ grid-template-columns:38px minmax(0,1fr); }
  .week-day-row .week-day-content{ grid-column:2; }
  .week-day-row .week-day-content:empty,
  .week-day-row .week-day-content.is-none{ display:none; }
}
.week-day-content.is-none{ display:none; }
.week-day-row.is-past .week-day-content{ opacity:.8; }
.skip-menu{ margin-top:8px; }
.skip-menu > summary{
  list-style:none; cursor:pointer; font-size:var(--fs-xs); color:var(--muted); padding:6px 0; min-height:32px;
  display:inline-flex; align-items:center; gap:4px; text-decoration:underline; text-underline-offset:3px;
}
.skip-menu > summary::-webkit-details-marker{ display:none; }
.skip-menu[open] > summary{ color:var(--text); }
.skip-menu .day-picker-btn{ display:block; width:100%; margin-top:6px; text-align:left; padding:9px 10px; }
.week-day-row.today{ border-color:var(--gold-dim); background:rgba(212,168,67,0.08); }
.week-day-name{ width:38px; flex-shrink:0; font-family:'Barlow Condensed',sans-serif; font-size:var(--fs-md); font-weight:700; text-transform:uppercase; color:var(--muted); }
.week-day-row.today .week-day-name{ color:var(--gold); }
.week-day-content{ min-width:0; }
.week-day-badge{ font-size:var(--fs-md); font-weight:600; }
.week-day-sub{ font-size:var(--fs-xs); color:var(--muted); margin-top:2px; line-height:1.4; }
.week-day-tag{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  padding:2px 8px; border-radius:var(--r-pill); flex-shrink:0; display:inline-block;
}
.tag-done{ background:rgba(61,184,122,0.15); color:var(--green); }
.tag-planned{ background:rgba(212,168,67,0.12); color:var(--gold); }
.tag-rest{ background:var(--surface); color:var(--muted); }

.schedule-settings{ margin-top:14px; padding-top:4px; border-top:1px solid var(--border); }
.settings-summary{ list-style:none; cursor:pointer; padding:10px 0; min-height:44px; display:flex; align-items:center; justify-content:space-between; font-size:var(--fs-sm); color:var(--muted); font-weight:600; }
.settings-summary::-webkit-details-marker{ display:none; }
.settings-summary::after{ content:'+'; font-size:18px; }
.schedule-settings[open] .settings-summary::after{ content:'–'; }
.schedule-settings[open] .settings-summary{ color:var(--text); }
.schedule-settings .day-picker-btn{ min-height:44px; }
.schedule-settings-label{ font-size:var(--fs-xs); color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.day-picker{ display:flex; gap:5px; margin-bottom:10px; }
.day-picker-btn{
  flex:1; padding:7px 0; border-radius:8px; border:1px solid var(--border); background:var(--surface2);
  color:var(--muted); font-size:var(--fs-sm); font-weight:700; cursor:pointer; font-family:'Barlow Condensed',sans-serif; min-height:36px;
}
.day-picker-btn.on.sbd{ background:var(--sq); color:#0d1420; border-color:var(--sq); }
.day-picker-btn.on.lob{ background:#5ea472; color:#0d1a12; border-color:#5ea472; }

/* ── ATTEMPT CALCULATOR ── */
.attempt-row{ display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border-radius:8px; padding:9px 12px; margin-bottom:8px; }
.attempt-row:last-child{ margin-bottom:0; }
.attempt-label{ font-size:var(--fs-sm); color:var(--muted); }
.attempt-kg{ font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:var(--gold); }
.attempt-note{ font-size:var(--fs-xs); color:var(--muted); }

/* ── BLOCK PROGRESSION ── */
.block-row{ margin-bottom:14px; }
.block-row:last-child{ margin-bottom:0; }
.block-row-head{ display:flex; justify-content:space-between; font-size:var(--fs-sm); margin-bottom:6px; }
.block-bars{ display:flex; gap:4px; }
.block-bar-item{ flex:1; text-align:center; }
.block-bar-bg{ height:50px; background:var(--surface2); border-radius:6px; position:relative; display:flex; align-items:flex-end; overflow:hidden; }
.block-bar-fill{ width:100%; background:var(--gold); border-radius:6px 6px 0 0; }
.block-bar-lbl{ font-size:11px; color:var(--muted); margin-top:3px; }
.block-bar-val{ font-size:var(--fs-xs); color:var(--text); margin-top:1px; font-weight:600; }

/* ── VERDICT ── */
.verdict-box{
  display:flex; gap:8px; font-size:var(--fs-sm); color:var(--text); line-height:1.5; font-style:italic;
  padding-top:10px; margin-top:10px; border-top:1px solid var(--border);
}

.next-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.next-row .next-label{ margin:0; }
.next-row .next-day{ margin:0; font-size:var(--fs-xl); }

/* ── V3 fase 3: samlet kalender + hybrid belastning ── */
.hy-week{ display:grid; grid-template-columns:1fr; gap:6px; }
@media (min-width:760px){ .hy-week{ grid-template-columns:repeat(7,minmax(0,1fr)); } }
.hy-day{ text-align:left; display:flex; flex-direction:column; gap:4px; padding:10px; min-height:64px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font:inherit; cursor:pointer; }
.hy-day:focus-visible,.hy-btn:focus-visible,.hy-sel:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.hy-day.today{ border-color:var(--gold); } .hy-day.sel{ background:rgba(212,168,67,0.10); border-color:var(--gold); } .hy-day.past{ opacity:.82; }
.hy-day.warn{ box-shadow:inset 3px 0 0 var(--red); }
.hy-dn{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; } .hy-dn b{ color:var(--text); font-size:15px; }
.hy-warn{ color:var(--red); text-transform:none; }

<script>
// Pak hver sektion (label + tilhørende slots) i en .dash-sec-wrapper, så
// desktop-layoutet kan flyde sektionerne som ubrydelige blokke i kolonner.
// Al app-logik bruger id'er, så DOM-omstruktureringen er ufarlig.
(function(){
  const main = document.querySelector('main');
  const kids = Array.from(main.children);
  // Sektioner der er brede / smalle på desktop, og hvilke der kan foldes sammen.
  const WIDE = ['I dag', 'Oversigt', 'Denne uge', 'Samlet kalender'];
  const S8 = []; const S4 = [];
  const FOLD = ['Samlet kalender','Månedsrapport','Oversigt','Powerbuilding','Løb','Recovery','Kropsudvikling','Belastning','Mål','Personlige rekorder','AI-analyse','Indstillinger'];
  const OPEN_MOBILE = ['Oversigt','Mål'];
  const isDesktop = window.matchMedia('(min-width:760px)').matches;
  function saved(key){ try { return localStorage.getItem('dash_sec_'+key); } catch(e){ return null; } }
  function save(key,val){ try { localStorage.setItem('dash_sec_'+key, val); } catch(e){} }
  let wrap = null;
  kids.forEach(el => {
    if (el.classList.contains('section-label')) {
      const title = el.textContent.trim();
      const fold = FOLD.includes(title);
      if (fold) {
        wrap = document.createElement('details');
        const sum = document.createElement('summary');
        sum.className = 'section-label';
        sum.id = el.id || '';
        sum.textContent = el.textContent;
        el.replaceWith(sum);
        el = sum;
        const st = saved(title);
        wrap.open = st !== null ? st === '1' : (isDesktop || OPEN_MOBILE.includes(title));
        wrap.addEventListener('toggle', () => save(title, wrap.open ? '1' : '0'));
      } else {
        wrap = document.createElement('section');
      }
      wrap.className = 'dash-sec' + (WIDE.includes(title) ? ' wide' : '') + (S8.includes(title) ? ' s8' : '') + (S4.includes(title) ? ' s4' : '');
      main.insertBefore(wrap, el);
      if (el.tagName === 'SUMMARY') { wrap.appendChild(el); return; }
    }
    if (wrap) wrap.appendChild(el);
  });
  // "I dag"-etiketten bruges kun af skærmlæsere (heroen har sin egen overskrift)
  const lt = document.getElementById('label-today');
  if (lt) lt.classList.add('sr-only');
})();
</script>

<script>
// ─── SBD cycle/peak structure ──────────────────────────────────────────────
// Duplikeret fra sbd/index.html's CYCLE/PEAK_WEEK arrays.
// OBS: hvis rækkefølgen eller navnene ændres i selve SBD-trackeren,
// skal de opdateres her også — dette er kun til visning, ikke beregning.
const SBD_CYCLE = [
  { id:'cst1',  short:'CST',   name:'Chest, Skulder & Tricep', type:'workout', desc:'Bænkpres (primær) + backdown + accessories' },
  { id:'low1',  short:'Lower', name:'Lower',                   type:'workout', desc:'Squat (primær) + backdown + accessories' },
  { id:'rest1', short:'Pause', name:'Pause',                   type:'rest' },
  { id:'bb1',   short:'B&B',   name:'Ryg & Bicep',             type:'workout', desc:'Deadlift conv. (primær) + accessories' },
  { id:'cst2',  short:'CST',   name:'Chest, Skulder & Tricep', type:'workout', desc:'Pause Bench (primær) + accessories' },
  { id:'rest2', short:'Pause', name:'Pause',                   type:'rest' },
  { id:'low2',  short:'Lower', name:'Lower',                   type:'workout', desc:'Box Squat (primær) + accessories' },
  { id:'bb2',   short:'B&B',   name:'Ryg & Bicep',             type:'workout', desc:'Deficit Deadlift (primær) + accessories' },
];
const SBD_PEAK = [
  { short:'SQ MAX', name:'Squat — Solo Max',    type:'workout' },
  { short:'Pause',  name:'Pause',               type:'rest' },
  { short:'DL MAX', name:'Deadlift — Solo Max', type:'workout' },
  { short:'Pause',  name:'Pause',               type:'rest' },
  { short:'BP MAX', name:'Bench — Solo Max',    type:'workout' },
  { short:'Pause',  name:'Pause',               type:'rest' },
  { short:'SBD',    name:'SBD — Konkurrence',   type:'workout' },
];

function readSbd(which){
  const key = which === 'main' ? 'sbd_state' : 'sbd_partner';
  let s;
  try { s = JSON.parse(localStorage.getItem(key)); } catch(e){ return null; }
  if (!s) return null;
  const totalDays = s.totalDays || 0;
  const week = Math.min(12, Math.floor(totalDays/7)+1);
  const block = week<=4 ? 1 : (week<=8 ? 2 : 3);
  const isTest = week===12;
  let day;
  if (isTest){
    const dayInWeek = Math.min(6, Math.max(0, totalDays - 11*7));
    day = SBD_PEAK[dayInWeek];
  } else {
    day = SBD_CYCLE[totalDays % 8];
  }
  const deload = week===4 || week===8 || (s.deloadWeeks && s.deloadWeeks.includes(week));
  return { discipline:'sbd', week, totalWeeks:12, block, isTest, deload, day, completed:(s.completedDays||[]).length };
}

// ─── Løb ────────────────────────────────────────────────────────────────────
// Læser 'lob_state' (Oliver) / 'lob_partner' (Ellen) — samme rå format som
// lob/index.html selv gemmer. Uge/fase beregnes her live ud fra profile.seasonStart,
// så det aldrig bliver en forældet snapshot, uanset hvornår appen sidst blev åbnet.
function lobSeasonWeek(seasonStart){
  const start = new Date(seasonStart+'T00:00:00');
  const diffDays = Math.floor((new Date()-start)/86400000);
  return Math.max(1, Math.floor(diffDays/7)+1);
}
function lobPhaseInfo(seasonStart){
  const wk = lobSeasonWeek(seasonStart);
  const isDeload = wk % 4 === 0;
  const posInBlock = ((wk-1) % 12)+1;
  let phase = posInBlock<=5 ? 'Base' : (posInBlock<=9 ? 'Build' : 'Peak');
  return { week:wk, posInBlock, phase, isDeload };
}
const LOB_PHASE_DESC = {
  Base:  'Rolige km i Zone 1-2 — åbn appen for dagens konkrete forslag.',
  Build: 'Tempoarbejde i Zone 3-4 — åbn appen for dagens konkrete forslag.',
  Peak:  'Skarpe intervaller mod målet — åbn appen for dagens konkrete forslag.',
};
// Forkorter forslagstekster fra løbeappen til én kort linje på dashboardet
// (fjerner forklarende halesnak som "(10-20% over din længste ...)" og "i alt for økten").
function shortPlanText(t){
  if(!t) return '';
  let s = String(t).replace(/^Målrace-tempo:\s*/i,'');
  s = s.replace(/\s+(i alt|for selve|\(10-20%|\(øvre ende|\(tærskeltempo|—\s).*$/i,'');
  s = s.replace(/[.\s]+$/,'');
  return s.length > 70 ? s.slice(0,67).trimEnd()+'…' : s;
}
function readLob(which){
  const key = which === 'main' ? 'lob_state' : 'lob_partner';
  let s;
  try { s = JSON.parse(localStorage.getItem(key)); } catch(e){ return null; }
  if (!s || !s.profile || !s.profile.onboarded) return null;

  const todayStr = localISO(new Date());
  if (s.notFeeling100 && s.notFeeling100[todayStr]) {
    return {
      discipline:'lob', week:0, totalWeeks:12, block:null, isTest:false, deload:false,
      day: { short:'Ikke 100%', type:'workout', desc:'Du har markeret dig selv som ikke 100% i dag — kør kort/let eller hold fri.' },
      completed:(s.runs||[]).length,
    };
  }

  const info = lobPhaseInfo(s.profile.seasonStart);
  const badge = info.isDeload ? 'Deload' : info.phase;
  let plan = null;
  try {
    const p = JSON.parse(localStorage.getItem('lob_today_plan_' + (which === 'main' ? 'main' : 'partner')));
    if (p && p.date === todayStr && (p.distance || p.pace)) plan = p;
  } catch(e) {}
  let goals = [];
  try {
    const gs = JSON.parse(localStorage.getItem('lob_goals_summary_' + (which === 'main' ? 'main' : 'partner')));
    if (gs && Array.isArray(gs.goals)) goals = gs.goals.filter(g => !g.validUntil || g.validUntil >= todayStr);
  } catch(e) {}
  return {
    plan, goals,
    discipline:'lob', week: info.posInBlock, totalWeeks: 12, block: null, isTest:false,
    deload: info.isDeload,
    day: { short: badge, type:'workout', desc: info.isDeload ? 'Let uge — ca. 60% volumen, fokus på restitution.' : LOB_PHASE_DESC[info.phase] },
    completed: (s.runs||[]).length
  };
}

// ── Plan-gap — matcher lob/index.html's "Plan Adjustment"-funktion ────────
const LOB_GAP_THRESHOLD_DAYS = 4;
function lobPlanGap(sRaw){
  if(!sRaw || !(sRaw.runs||[]).length) return null;
  const sorted=[...sRaw.runs].sort((a,b)=>b.date.localeCompare(a.date));
  const lastRun=sorted[0];
  const daysSince=Math.floor((new Date()-new Date(lastRun.date+'T00:00:00'))/86400000);
  if(daysSince<LOB_GAP_THRESHOLD_DAYS) return null;
  if(sRaw.profile && sRaw.profile.dismissedGapFor===lastRun.date) return null;
  return { daysSince };
}

const DISC_META = {
  sbd: { label:'SBD — Styrke', icon:'🏋️', url:'./sbd/index.html' },
  lob: { label:'Løb — Kondition', icon:'🏃', url:'./lob/index.html' },
};

const STRETCH_SUGGESTIONS = {
  'CST':   'Dørkarm-stræk for bryst/skuldre, 2×30 sek pr. side.',
  'Lower': 'Hoftebøjer- og hamstring-stræk, 2×30 sek pr. side.',
  'B&B':   'Hængende lat-stræk + cat-cow, 2×30 sek.',
  'SQ MAX':'Hoftebøjer- og hamstring-stræk, 2×30 sek pr. side.',
  'DL MAX':'Hængende lat-stræk + cat-cow, 2×30 sek.',
  'BP MAX':'Dørkarm-stræk for bryst/skuldre, 2×30 sek pr. side.',
  'SBD':   'Fuldkrops-stræk: bryst, hofte, lat — 20 sek hver.',
};
const LOB_STRETCH = 'Læg- og hamstring-stræk efter løbeturen, 2×20 sek pr. side.';
const LOB_WARMUP = 'Let gang/jog + benspark + ankelrotationer, 3-5 min før du sætter farten op.';

// Dynamisk opvarmning FØR SBD — bevidst ikke statisk stræk her (kan svække
// kraftudviklingen midlertidigt), kun kropsvægt-bevægelser der åbner kroppen.
const WARMUP_SUGGESTIONS = {
  'CST':    'Armcirkler + skulder-rotationer + let båndtræk, 1-2 min.',
  'Lower':  'Kropsvægt-squats + hofte-cirkler + benspark, 1-2 min.',
  'B&B':    'Cat-cow + let banded row + skulderblads-træk, 1-2 min.',
  'SQ MAX': 'Kropsvægt-squats + hofte-cirkler + benspark, 1-2 min.',
  'DL MAX': 'Cat-cow + let banded row + skulderblads-træk, 1-2 min.',
  'BP MAX': 'Armcirkler + skulder-rotationer + let båndtræk, 1-2 min.',
  'SBD':    'Fuldkrops: armcirkler, hofte-cirkler, cat-cow — 20 sek hver.',
};

function renderCard(status, discipline, kind){
  const meta = DISC_META[discipline];
  if (!status){
    return `<div class="empty-card">
      <div class="disc-name">${meta.icon} ${meta.label}</div>
      <p>${discipline==='lob'
        ? 'Løbe-trackeren er ikke sat op endnu på denne enhed. Dashboardet forbinder automatisk, når lob/index.html begynder at gemme data.'
        : 'Ingen data fundet endnu — åbn trackeren og log din første session.'}</p>
      <a class="open-btn" href="${meta.url}">Åbn ${discipline==='lob'?'løb':'SBD'}</a>
    </div>`;
  }
  const pct = Math.round((status.week-1)/status.totalWeeks*100);
  const badge = status.deload ? 'Deload-uge' : (status.isTest ? 'Test/peak-uge' : `Blok ${status.block||''}`);
  const isRest = status.day.type === 'rest';
  const desc = status.day.desc || (isRest ? 'Aktiv restitution / hviledag' : '');
  const note = kind==='secondary'
    ? `<div class="secondary-note">Sekundær prioritet — pres dig ikke. Reducér intensitet hvis primær kræver energien.</div>`
    : '';
  const stretch = isRest ? '' : (discipline==='lob' ? LOB_STRETCH : (STRETCH_SUGGESTIONS[status.day.short] || ''));
  const stretchHtml = stretch ? `<div class="deferred-note" style="margin-top:8px;">🧘 ${stretch}</div>` : '';
  const planHtml = (discipline==='lob' && status.plan && (status.plan.distance || status.plan.pace))
    ? `<div class="deferred-note" style="margin-top:8px;">🏃 <b>${status.plan.title||'Dagens løb'}</b>${status.plan.distance?`<div style="margin-top:4px;">📏 Distance: ${shortPlanText(status.plan.distance)}</div>`:''}${status.plan.pace?`<div style="margin-top:4px;">🎯 Tempo: ${shortPlanText(status.plan.pace)}</div>`:''}</div>`
    : '';
  const goalsHtml = (discipline==='lob' && status.goals && status.goals.length)
    ? `<div class="deferred-note" style="margin-top:8px;">🎯 <b>Mål</b>${status.goals.map(g=>`<div style="margin-top:4px;">${g.done?'✓ ':''}${g.title} — ${g.curLabel} / ${g.targetLabel} (${g.pct}%)</div>`).join('')}</div>`
    : '';
  const warmup = isRest ? '' : (discipline==='lob' ? LOB_WARMUP : (WARMUP_SUGGESTIONS[status.day.short] || ''));
  const warmupHtml = warmup ? `<div class="deferred-note" style="margin-top:8px;">🔥 ${warmup}</div>` : '';
  return `<div class="card ${kind}">
    <div class="card-head">
      <div><div class="disc-name"><span class="disc-icon">${meta.icon}</span>${meta.label}</div></div>
      <div class="week-pill">Uge ${status.week}/${status.totalWeeks} · ${badge}</div>
    </div>
    <div class="card-body">
      <div class="next-row"><span class="next-label">Næste i trackeren</span><span class="next-day">${status.day.short || status.day.name}</span>${isRest ? `<span class="rest-note">💤 Hviledag</span>` : ''}</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${status.completed} gennemførte sessioner · ${pct}% af programmet</div>

// Duplikeret fra lob/index.html — VDOT (Daniels-Gilbert)
function vdotFromDistanceTime(distanceKm, minutes){
  if(!distanceKm || !minutes) return null;
  const v=(distanceKm*1000)/minutes, t=minutes;
  const vo2=-4.60+0.182258*v+0.000104*v*v;
  const pct=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  const vdot=vo2/pct;
  return isFinite(vdot)?vdot:null;
}
function zoneBoundsFor(maxHR){
  return [0.50,0.60,0.70,0.80,0.90].map((lo,i)=>({lo:lo*maxHR, hi:(i<4?[0.60,0.70,0.80,0.90][i]:1.05)*maxHR}));
}
function zoneIndexFor(hr, maxHR){
  const z=zoneBoundsFor(maxHR);
  for(let i=0;i<z.length;i++){ if(hr>=z[i].lo && hr<z[i].hi) return i; }
  return hr<z[0].lo ? 0 : z.length-1;
}
// Lokal dato som YYYY-MM-DD — toISOString() giver UTC-datoen og forskyder
// datoer i dansk tid (fx blev mandag til onsdag i ugeskemaet).
function localISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function weekStartOf(dateStr){
  const d=new Date(dateStr+'T00:00:00'); const day=d.getDay(); const diff=(day===0?-6:1-day);
  d.setDate(d.getDate()+diff); return localISO(d);
}
function fmtClock(sec){
  if(sec==null || !isFinite(sec)) return '—';
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.round(sec%60);
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtPaceMinKm(secPerKm){
  if(!isFinite(secPerKm)||secPerKm<=0) return '—';
  const m=Math.floor(secPerKm/60), s=Math.round(secPerKm%60);
  return `${m}:${String(s).padStart(2,'0')}/km`;
}

// ── SBD rå-læsere ────────────────────────────────────────────────────────
function readSbdRaw(which){
  try{ return JSON.parse(localStorage.getItem(which==='main'?'sbd_state':'sbd_partner')); }catch(e){ return null; }
}
function sbdWeekWindow(s){
  const totalDays=s.totalDays||0, week=Math.min(12,Math.floor(totalDays/7)+1);
  return { week, weekStart:(week-1)*7, weekEnd:week*7 };
}
function sbdWeekStats(s){
  const {week,weekStart,weekEnd}=sbdWeekWindow(s);
  const days=(s.completedDays||[]).filter(d=>d>=weekStart&&d<weekEnd);
  let tonnage=0,sets=0,reps=0,intSum=0,intCnt=0;
  const muscleSets={};
  days.forEach(d=>{
    const log=(s.logs||{})['day'+d]; if(!log) return;
    (log.exercises||[]).forEach(ex=>{
      const muscle=MUSCLE_MAP[ex.name];
      const liftKey=MAIN_LIFT_MAP[ex.name];
      (ex.sets||[]).forEach(st=>{
        if(!st.done) return;
        const kg=parseFloat(st.kg), rp=parseInt(st.reps);
        if(kg>0 && rp>0){
          tonnage+=kg*rp; sets++; reps+=rp;
          if(muscle) muscleSets[muscle]=(muscleSets[muscle]||0)+1;
          if(liftKey && s.oneRM && s.oneRM[liftKey]){ intSum+=(kg/s.oneRM[liftKey])*100; intCnt++; }
        }
      });
    });
  });
  return { week, days:days.length, tonnage, sets, reps, muscleSets, avgIntensity: intCnt? intSum/intCnt : null };
}
function sbdBodyweightStats(s){
  const bw=s.bodyweight||{}, st=s.sessionTimes||{};
  const entries=Object.keys(bw).map(dayIdx=>{
    const t=st['day'+dayIdx]; const ts=t?(t.end||t.start):null;
    return { kg:bw[dayIdx], ts };
  }).filter(e=>e.ts && e.kg>0).sort((a,b)=>a.ts-b.ts);
  if(!entries.length) return null;
  const today=entries[entries.length-1].kg;
  const weekAgo=Date.now()-7*86400000, twoWeeksAgo=weekAgo-7*86400000;
  const last7=entries.filter(e=>e.ts>=weekAgo);
  const prev7=entries.filter(e=>e.ts>=twoWeeksAgo&&e.ts<weekAgo);
  const avg7=last7.length? last7.reduce((a,e)=>a+e.kg,0)/last7.length : today;
  const prevAvg=prev7.length? prev7.reduce((a,e)=>a+e.kg,0)/prev7.length : null;
  return { today, avg7, trend: prevAvg!=null ? avg7-prevAvg : null };
}
function sbdMainLifts(s){
  const pr=s.pr||{}, oneRM=s.oneRM||{}, start=s.programStart1RM||oneRM;
  function findPR(names){ for(const n of names){ if(pr[n]&&pr[n].e1rm) return pr[n].e1rm; } return null; }
  return ['sq','bp','dl'].map(k=>({
    key:k, label:LIFT_LABEL[k], current:oneRM[k]||null,
    pr: findPR(LIFT_PR_NAMES[k]) || oneRM[k] || null,
    target: start[k] ? start[k]*1.0625 : null,
  }));
}
function sbdLoadRatio(s){
  const {week}=sbdWeekWindow(s);
  const from=Math.max(1,week-3);
  let thisWeekSets=0, totalSets=0, weeksCounted=0;
  for(let w=from; w<=week; w++){
    const ws=(w-1)*7, we=w*7;
    const days=(s.completedDays||[]).filter(d=>d>=ws&&d<we);
    let sets=0;
    days.forEach(d=>{
      const log=(s.logs||{})['day'+d]; if(!log) return;
      (log.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(st=>{ if(st.done&&parseFloat(st.kg)>0) sets++; }));
    });
    if(w===week) thisWeekSets=sets;
    totalSets+=sets; weeksCounted++;
  }
  const avg=totalSets/weeksCounted;
  if(!avg) return null;
  return { ratio:thisWeekSets/avg, thisWeekSets, avg };
}

// ── Løb rå-læsere ────────────────────────────────────────────────────────
function readLobRaw(which){
  try{ return JSON.parse(localStorage.getItem(which==='main'?'lob_state':'lob_partner')); }catch(e){ return null; }
}
function lobWeekStats(s){
  const runs=s.runs||[];
  const todayKey=weekStartOf(localISO(new Date()));
  const wk=runs.filter(r=>weekStartOf(r.date)===todayKey);
  const km=wk.reduce((a,r)=>a+r.distanceKm,0);
  const sec=wk.reduce((a,r)=>a+r.durationSec,0);
  const hrs=wk.filter(r=>r.avgHR).map(r=>r.avgHR);
  return {
    km, sec, runs:wk.length,
    avgHR: hrs.length? Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length) : null,
    avgPace: km>0 ? sec/km : null,
  };
}
function lobVO2(s){
  const maxHR=Number(s.profile?.maxHR), restHR=Number(s.profile?.restHR);
  const hrMethod=(maxHR&&restHR)? 15.3*(maxHR/restHR) : null;
  const candidates=(s.runs||[]).filter(r=>r.durationSec>=15*60 && r.distanceKm>=2);
  let vdot=null;
  candidates.forEach(r=>{ const v=vdotFromDistanceTime(r.distanceKm, r.durationSec/60); if(v && (vdot===null||v>vdot)) vdot=v; });
  return { hrMethod, vdot };
}
function lobZones(s){
  const maxHR=Number(s.profile?.maxHR); if(!maxHR) return null;
  const recent=[...(s.runs||[])].filter(r=>r.avgHR).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  if(!recent.length) return null;
  const counts=[0,0,0,0,0];
  recent.forEach(r=>counts[zoneIndexFor(r.avgHR,maxHR)]++);
  return counts;
}
const DIST_BUCKETS=[
  {label:'1 km', km:1, tol:0.05}, {label:'5 km', km:5, tol:0.15}, {label:'10 km', km:10, tol:0.3},
  {label:'Halvmarathon', km:21.1, tol:0.5}, {label:'Marathon', km:42.2, tol:1.0},
];
function lobDistancePRs(s){
  const runs=s.runs||[];
  return DIST_BUCKETS.map(b=>{
    const matches=runs.filter(r=>Math.abs(r.distanceKm-b.km)<=b.tol);
    if(!matches.length) return { label:b.label, time:null };
    const best=matches.reduce((a,r)=>r.durationSec<a.durationSec?r:a);
    return { label:b.label, time:best.durationSec };
  });
}
function lobGoal(s){
  const baseline=s.profile?.goalBaselineVDOT, targetPct=s.profile?.goalTargetPct||8;
  if(!baseline) return null;
  const {vdot}=lobVO2(s); if(!vdot) return null;
  const target=baseline*(1+targetPct/100);
  const progressPct=Math.max(0,Math.min(150,((vdot-baseline)/(target-baseline))*100));
  const baselineDate=new Date((s.profile.goalBaselineDate||s.profile.seasonStart)+'T00:00:00');
  const weeksElapsed=Math.max(0, Math.floor((new Date()-baselineDate)/(7*86400000)));
  const weeksLeft=Math.max(0, 12-weeksElapsed);
  return { baseline, current:vdot, target, progressPct, targetPct, weeksLeft };
}
function lobExtraPRs(s){
  const runs=s.runs||[]; if(!runs.length) return null;
  const longest=runs.reduce((a,r)=>r.distanceKm>a.distanceKm?r:a);
  const totals={};
  runs.forEach(r=>{ const w=weekStartOf(r.date); totals[w]=(totals[w]||0)+r.distanceKm; });
  const highestWeek=Math.max(...Object.values(totals));
  const longestDuration=runs.reduce((a,r)=>r.durationSec>a.durationSec?r:a);
  return { longestKm:longest.distanceKm, highestWeekKm:highestWeek, longestDurationSec:longestDuration.durationSec };
}
function lobLoadRatio(s){
  const runs=s.runs||[]; if(!runs.length) return null;
  const totals={};
  runs.forEach(r=>{ const w=weekStartOf(r.date); totals[w]=(totals[w]||0)+r.distanceKm; });
  const thisWeekKey=weekStartOf(localISO(new Date()));
  const thisWeekKm=totals[thisWeekKey]||0;
  const priorKeys=Object.keys(totals).filter(k=>k<thisWeekKey).sort().slice(-4);
  if(!priorKeys.length) return null;
  const avg=priorKeys.reduce((a,k)=>a+totals[k],0)/priorKeys.length;
  if(!avg) return null;
  return { ratio:thisWeekKm/avg, thisWeekKm, avg };
}

// ── Readiness (fra restScore 1-5 + energyScore 0-100, seneste kendte) ─────
function sbdReadiness(s){
  function latestOf(obj){
    if(!obj) return null;
    const keys=Object.keys(obj).map(Number).sort((a,b)=>b-a);
    return keys.length? obj[keys[0]] : null;
  }
  const rest=latestOf(s.restScore), energy=latestOf(s.sleepLog);
  if(rest==null && energy==null) return null;
  const restPart=rest!=null? (rest/5)*100 : 60;
  const energyPart=energy!=null? energy : 60;
  return { score:Math.round(restPart*0.5+energyPart*0.5), rest, energy };
}

// ── Regelbaserede AI-indsigter (kun ægte data) ────────────────────────────
function buildInsights(sRaw, lRaw){
  const out=[];
  if(sRaw && (sRaw.completedDays||[]).length){
    const lifts=sbdMainLifts(sRaw);
    lifts.forEach(l=>{
      if(l.current && l.target){
        const pct=((l.current-l.target/1.0625)/(l.target/1.0625)*100);
        if(Math.abs(pct)>=3){
          out.push(`Din ${l.label} er ${pct>0?'steget':'faldet'} ${Math.abs(pct).toFixed(1)}% siden programstart.`);
        }
      }
    });
    const load=sbdLoadRatio(sRaw);
    if(load && load.ratio>=1.15) out.push(`Denne uges styrke-volumen er ${Math.round((load.ratio-1)*100)}% over dit 4-ugers snit — hold øje med restitution.`);
  }
  if(lRaw && (lRaw.runs||[]).length){
    const load=lobLoadRatio(lRaw);
    if(load) out.push(`Du løber ${Math.round((load.ratio-1)*100)}% ${load.ratio>=1?'mere':'mindre'} end dit 4-ugers snit denne uge.`);
    const goal=lobGoal(lRaw);
    if(goal) out.push(`VDOT-mål: ${Math.round(goal.progressPct)}% af vejen mod +${goal.targetPct}%.`);
  }
  if(out.length===0) out.push('Log flere sessioner for at få automatiske indsigter her — kræver mindst et par uger med data.');
  return out.slice(0,4);
}

// ── Ugentlig fatigue (duplikeret fra getWeeklyFatigue) ────────────────────
function sbdWeeklyFatigue(s){
  const totalDays=s.totalDays||0, lookback=14;
  const recentDays=(s.completedDays||[]).filter(d=>d>=totalDays-lookback && d<totalDays);
  let rpeSum=0, rpeCount=0;
  recentDays.forEach(d=>{
    const log=(s.logs||{})['day'+d]; if(!log) return;
    (log.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(st=>{ if(st.done&&st.rpe){ rpeSum+=parseFloat(st.rpe); rpeCount++; } }));
  });
  return rpeCount<5 ? null : rpeSum/rpeCount;
}

// ── Ugentlig opsummering + verdict (duplikeret fra renderWeeklySummary) ───
function sbdWeeklyVerdict(s){
  const {week}=sbdWeekWindow(s);
  const prevWeek=week-1;
  if(prevWeek<1) return null;
  const prevStart=(prevWeek-1)*7, prevEnd=prevWeek*7;
  const prevDays=(s.completedDays||[]).filter(d=>d>=prevStart&&d<prevEnd);
  if(!prevDays.length) return null;
  const workouts=prevDays.filter(d=>SBD_CYCLE[d%8].type==='workout').length;
  let rpeSum=0,rpeCount=0;
  prevDays.forEach(d=>{
    const log=(s.logs||{})['day'+d]; if(!log) return;
    (log.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(st=>{ if(st.done&&st.rpe){ rpeSum+=parseFloat(st.rpe); rpeCount++; } }));
  });
  const avgRPE=rpeCount>0? rpeSum/rpeCount : null;
  let sleepSum=0, sleepCount=0;
  for(let d=prevStart; d<prevEnd; d++){ const h=(s.sleepLog||{})[d]; if(h){ sleepSum+=h; sleepCount++; } }
  const avgEnergy=sleepCount>0? Math.round(sleepSum/sleepCount) : null;
  const fatigueHigh=avgRPE!=null && avgRPE>=8.5;
  const sleepLow=avgEnergy!=null && avgEnergy<61;
  let verdict;
  if(fatigueHigh && sleepLow) verdict='😮\u200d💨 Høj træthed og lav Energy Score — overvej deload eller ekstra hviledag.';
  else if(fatigueHigh) verdict='💪 Hård uge — god indsats. Hold øje med restitution denne uge.';
  else if(sleepLow) verdict='😴 Lav Energy Score sidst — prioriter søvn og restitution.';
  else if(workouts>=5) verdict='✅ Stærk uge — god konsistens og kontrolleret belastning.';
  else verdict='📈 Solid uge. Fortsæt som planlagt.';
  return { prevWeek, workouts, avgRPE, avgEnergy, verdict };
}

// ── Blok-progression (duplikeret fra renderBlockProgression) ──────────────
function sbdBlockProgression(s){
  const start=s.programStart1RM || s.oneRM || {};
  const lifts=[{key:'sq',dayId:'low1',label:'Squat'},{key:'bp',dayId:'cst1',label:'Bench'},{key:'dl',dayId:'bb1',label:'Deadlift'}];
  const BLOCK_TARGETS={1:0.825,2:0.875,3:0.925};
  const blocks=[{b:1,weekStart:1,weekEnd:4},{b:2,weekStart:5,weekEnd:8},{b:3,weekStart:9,weekEnd:12}];
  function bestE1RM(dayId,weekStart,weekEnd){
    const dayStart=(weekStart-1)*7, dayEnd=weekEnd*7;
    let best=0;
    (s.completedDays||[]).filter(d=>SBD_CYCLE[d%8].id===dayId && d>=dayStart && d<dayEnd).forEach(d=>{
      const sets=(s.logs||{})['day'+d]?.exercises?.[0]?.sets?.filter(st=>st.done&&parseFloat(st.kg)>0&&parseInt(st.reps)>0)||[];
      sets.forEach(st=>{ const e=epley(parseFloat(st.kg),parseInt(st.reps)); if(e>best) best=e; });
    });
    return best>0 ? Math.round(best*10)/10 : null;
  }
  return lifts.map(lift=>{
    const startRM=start[lift.key]||0;
    const vals=blocks.map(b=>({
      b:b.b, actual:bestE1RM(lift.dayId,b.weekStart,b.weekEnd),
      target:Math.round(startRM*BLOCK_TARGETS[b.b]*(1+(b.b*0.035))*10)/10
    }));
    return { ...lift, startRM, blocks:vals, hasData:vals.some(v=>v.actual!==null) };
  });
}

// ── Åbningsforsøg / attempt-calculator (duplikeret fra calcAttempts) ──────
function calcAttemptsFor(oneRM){
  if(!oneRM) return null;
  const r=v=>Math.round(v*2)/2;
  return [ r(oneRM*0.90), r(oneRM*0.97), r(oneRM*1.03) ];
}

const DAY_NAMES=['Søn','Man','Tir','Ons','Tor','Fre','Lør'];

// ── Fælles skema-model: hver dag kan have sbd (med cycleId) OG/ELLER lob ────
// (ikke længere gensidigt udelukkende — Ellen løber og styrketræner ofte
// samme dag).
// 9 dage: 3 par af 2 SBD-dage i træk, hver adskilt af en løbedag — også ved
// selve cyklus-overgangen (BB2 → CST1), ellers bliver det 4 SBD-dage i træk
// der hvor cyklussen gentager. De to løb-slots der ligger op til/efter en
// bendag er markeret lette; det tredje (mellem BB2 og CST1) rammer ingen
// bendag og kan køres som en normal/hårdere tur.
// SBD-slots har ingen fast cycleId — hvilket løft der vises udregnes fra din
// faktiske fremgang (totalDays), ikke fra kalenderdage siden ankeret. Det er
// rettelsen for buggen hvor fremtidige dage kunne vise forkert indhold, hvis
// virkeligheden afveg fra den perfekte 2-på/1-fri-rytme.
const OLIVER_PATTERN = [
  { sbd:{}, lob:null },
  { sbd:{}, lob:null },
  { sbd:null, lob:{easy:true} },
  { sbd:{},  lob:null },
  { sbd:{}, lob:null },
  { sbd:null, lob:{easy:true} },
  { sbd:{}, lob:null },
  { sbd:{},  lob:null },
  { sbd:null, lob:{easy:false} },
];
// Ellens mønster: samme dage som Oliver (hun matcher hans SBD-dage), men SBD
// er markeret valgfri (hun springer over når hun er for træt), og hun løber
// praktisk talt hver dag — også på Olivers SBD-dage, da de to ofte
// kombineres samme dag i virkeligheden. Ingen tvungen "ren" hviledag her,
// da det ikke matcher hvad hun faktisk gør.
const ELLEN_PATTERN = OLIVER_PATTERN.map(o => ({
  sbd: o.sbd ? { cycleId:o.sbd.cycleId, optional:true } : null,
  lob: null, // løb er ikke cyklus-baseret for Ellen — se ELLEN_LOB_WEEKDAYS
}));
// Ellen har krævet faste løbedage, uafhængigt af den rullende cyklus:
// Tirsdag, Torsdag, Fredag, Søndag. JS Date.getDay(): 0=søn,1=man,2=tir,
// 3=ons,4=tor,5=fre,6=lør.
const ELLEN_LOB_WEEKDAYS = new Set([2,4,5,0]);
function patternForPerson(personKey){ return personKey==='ellen' ? ELLEN_PATTERN : OLIVER_PATTERN; }

function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW ikke registreret:', e));
  // Genindlæs automatisk én gang når en ny service worker overtager, så
  // opdateringer slår igennem uden at man selv skal lukke/genåbne appen.
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(_swReloaded) return;
    _swReloaded=true;
    window.location.reload();
  });
}

// timer i service workeren — browsere dræber den efter få minutter, så den

// er klokken over 7 og er der ikke sendt i dag, sendes dagens besked.
function buildDayReminder(dateStr, personKey){
  const slot = slotForDate(dateStr, getScheduleAnchor(), personKey) || { sbd:null, lob:null };
  const weekdayIdx = new Date(dateStr+'T12:00:00').getDay();
  const lobPlan = personKey==='ellen'
    ? (ELLEN_LOB_WEEKDAYS.has(weekdayIdx) ? { easy: !!slot.sbd } : null)
    : slot.lob;
  const parts=[];
  if(slot.sbd) parts.push(slot.sbd.optional ? '🏋️ SBD (valgfri)' : '🏋️ SBD');
  if(lobPlan) parts.push(lobPlan.easy ? '🏃 let løb' : '🏃 løb');
  const title = parts.length ? parts.join(' + ')+' i dag' : '😴 Hviledag i dag';
  const body = parts.length
    ? (slot.sbd && slot.sbd.optional ? 'SBD er valgfri i dag — spring over hvis du er for træt.' : 'Dit mønster siger '+parts.join(' + ')+' i dag.')
    : 'Ingen planlagt træning i dag — nyd hviledagen.';
  return { title, body };
}

function checkDailyReminder(){
  if(getNotificationPermission()!=='granted') return;
  if(!('serviceWorker' in navigator)) return;
  const now=new Date();
  if(now.getHours()<7) return;
  const today=localISO(now);
  if(localStorage.getItem('dash_notif_sent')===today) return;
  const active=localStorage.getItem('dash_profile')||'oliver';
  const { title, body } = buildDayReminder(today, active);
  navigator.serviceWorker.ready.then(reg=>{
    reg.showNotification(title, { body, icon:'./dash-icon.svg', badge:'./dash-icon.svg', tag:'dash-daily' });
    localStorage.setItem('dash_notif_sent', today);
  }).catch(e=>console.log('Kunne ikke sende påmindelse:', e));
}

function startReminderLoop(){
  checkDailyReminder();
  setInterval(checkDailyReminder, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDailyReminder(); });
}

async function sendTestNotification(){
  if(getNotificationPermission()!=='granted'){ alert('Aktivér påmindelser først (knappen ovenfor).'); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('🔔 Test-notifikation', { body:'Notifikationer virker på denne enhed.', icon:'./dash-icon.svg', tag:'dash-test' });
  }catch(e){ alert('Kunne ikke sende: '+e.message); }
}

// ── "Ikke mulig i dag" — skub en enkelt dag videre til i morgen ───────────
// Bruges fx når centeret har lukket inden fyraften i weekender du arbejder.
// Gemmes pr. profil, så det ikke påvirker den anden persons skema.
function blockedDatesKey(personKey){ return `dash_blocked_dates_${personKey}`; }
function getBlockedDates(personKey){
  try{
    const raw=JSON.parse(localStorage.getItem(blockedDatesKey(personKey)));
    return Array.isArray(raw) ? raw : [];
  }catch(e){ return []; }
}
function toggleBlockedDate(personKey, dateStr){
  const blocked=getBlockedDates(personKey);
  const i=blocked.indexOf(dateStr);
  if(i>=0) blocked.splice(i,1); else blocked.push(dateStr);
  localStorage.setItem(blockedDatesKey(personKey), JSON.stringify(blocked));
  TP.calNote(hybProfileKey(personKey),'blocked',dateStr,i<0); // V3.1: register til tabsfri sammenfletning mellem enheder
  render();
}
// ── "Ikke mulig — indhent" — drop næste pause/løbedag i stedet ────────────
// Alternativet til "ryk alt": dagens indhold skubbes til i morgen, men den
// første efterfølgende ikke-SBD-dag (pause/løbedag) droppes, så man træner
// 2 dage i træk og cyklussen falder tilbage på plads af sig selv.
function catchupDatesKey(personKey){ return `dash_catchup_dates_${personKey}`; }
function getCatchupDates(personKey){
  try{
    const raw=JSON.parse(localStorage.getItem(catchupDatesKey(personKey)));
    return Array.isArray(raw) ? raw : [];
  }catch(e){ return []; }
}
function toggleCatchupDate(personKey, dateStr){
  const list=getCatchupDates(personKey);
  const i=list.indexOf(dateStr);
  if(i>=0) list.splice(i,1); else list.push(dateStr);
  localStorage.setItem(catchupDatesKey(personKey), JSON.stringify(list));
  TP.calNote(hybProfileKey(personKey),'catchup',dateStr,i<0);
  render();
}

// Finder mønster-slottet for en given dato ved at gå dag for dag fra ankeret.
// "Ikke mulig"-knapperne gælder KUN styrke (SBD); løb er altid muligt og følger
// det uforskudte mønster:
// - blokerede dage ("ryk styrke") optager intet SBD-slot → styrken efter skubbes
// - indhentnings-dage optager intet SBD-slot OG markerer at næste ikke-SBD-slot
//   skal springes over i styrke-rækken, så styrken genindhenter sig selv
// Returnerer altid {sbd, lob}; sbd er null på selve den blokerede dag (render
// viser dens egen celle-tekst), lob er aldrig påvirket.
function slotForDate(dateStr, anchor, personKey, blockedList, catchupList){
  const pattern=patternForPerson(personKey);
  const len=pattern.length;
  const d1=new Date(anchor+'T12:00:00'), d2=new Date(dateStr+'T12:00:00');
  const diff=Math.round((d2-d1)/86400000);
  if(diff<0) return pattern[((diff%len)+len)%len];
  const plainLob = pattern[diff%len].lob; // løb følger altid det uforskudte mønster
  const blocked=new Set(blockedList||getBlockedDates(personKey));
  const catchup=new Set(catchupList||getCatchupDates(personKey));
  let cursor=0, pending=0;
  const d=new Date(d1);
  for(let i=0;i<=diff;i++){
    const ds=localISO(d);
    let slot=null;
    if(catchup.has(ds)){ pending++; }
    else if(!blocked.has(ds)){
      let idx=cursor%len;
      if(pending>0 && !pattern[idx].sbd){ cursor++; pending--; idx=cursor%len; }
      slot=pattern[idx];
      cursor++;
    }
    if(i===diff) return { sbd: slot ? slot.sbd : null, lob: plainLob };
    d.setDate(d.getDate()+1);
  }
  return { sbd:null, lob:plainLob };
}

// Samme algoritme som slotForDate, men beregner et helt datointerval i ÉT gennemløb fra ankeret (O(n) i stedet for O(n²)).
// Bruges af den samlede kalender, hvor analysen genberegner planen mange gange. Ækvivalens med slotForDate testes i e2e.
function slotMapForRange(fromDate, toDate, anchor, personKey, blockedList, catchupList){
  const pattern=patternForPerson(personKey), len=pattern.length;
  const blocked=new Set(blockedList||getBlockedDates(personKey)), catchup=new Set(catchupList||getCatchupDates(personKey));
  const out={}; const d1=new Date(anchor+'T12:00:00');
  const dayDiff=ds=>Math.round((new Date(ds+'T12:00:00')-d1)/86400000);
  const lastDiff=dayDiff(toDate);
  const d=new Date(d1); let cursor=0, pending=0;
  for(let i=0;i<=lastDiff;i++){
    const ds=localISO(d); let slot=null;
    if(catchup.has(ds)){ pending++; }
    else if(!blocked.has(ds)){
      let idx=cursor%len;
      if(pending>0 && !pattern[idx].sbd){ cursor++; pending--; idx=cursor%len; }
      slot=pattern[idx]; cursor++;
    }
    out[ds]={ sbd: slot?slot.sbd:null, lob: pattern[i%len].lob };
    d.setDate(d.getDate()+1);
  }
  const f=dayDiff(fromDate);
  for(let i=f;i<0;i++){ const ds=TP.addDays(anchor,i); out[ds]=pattern[((i%len)+len)%len]; }
  return out;
}

let scheduleWeekOffset = 0;
function scheduleShiftWeek(delta){
  scheduleWeekOffset += delta;
  render();
}
function computeWeekDates(offset){
  const off = offset||0;
  const base=new Date(weekStartOf(localISO(new Date()))+'T00:00:00');
  base.setDate(base.getDate() + off*7);
  const dates=[];
  for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(base.getDate()+i); dates.push(localISO(d)); }
  return dates; // Man..Søn
}
function sbdCompletedByDate(sRaw){
  const map={};
  if(!sRaw) return map;
  const st=sRaw.sessionTimes||{};
  (sRaw.completedDays||[]).forEach(d=>{
    const t=st['day'+d]; const ts=t?(t.end||t.start):null; if(!ts) return;
    map[localISO(new Date(ts))]=SBD_CYCLE[d%8];
  });
  return map;
}
function lobCompletedByDate(lRaw){
  const map={};
  if(!lRaw) return map;
  (lRaw.runs||[]).forEach(r=>{ if(!map[r.date]) map[r.date]=[]; map[r.date].push(r); });
  return map;
}
// Dagens løbeforslag + typisk rolig tur, som løbeappen gemmer lokalt (se lob/index.html).
function lobExtrasFor(personKey){
  const which = personKey==='ellen' ? 'partner' : 'main';
  const out = { plan:null, easy:null };
  try{
    const p = JSON.parse(localStorage.getItem('lob_today_plan_'+which));
    if(p && p.date===localISO(new Date()) && (p.distance || p.pace)) out.plan = p;
  }catch(e){}
  try{
    const e = JSON.parse(localStorage.getItem('lob_easy_summary_'+which));
    if(e && (e.easyPace || e.easyKm)) out.easy = e;
  }catch(e2){}
  return out;
}
function lobDetailHtml(lobPlan, isToday, extras){
  if(isToday && extras.plan){
    const p = extras.plan;
    return (p.distance ? `<div class="week-day-sub">📏 ${shortPlanText(p.distance)}</div>` : '')
         + (p.pace ? `<div class="week-day-sub">🎯 ${shortPlanText(p.pace)}</div>` : '');
  }
  if(lobPlan && lobPlan.easy && extras.easy){
    const e = extras.easy;
    return `<div class="week-day-sub">Typisk: ${e.easyKm ? '~'+e.easyKm+' km' : ''}${e.easyKm && e.easyPace ? ' · ' : ''}${e.easyPace || ''}</div>`;
  }
  return '';
}
// "I dag": ét tydeligt svar på hvad der skal trænes. Bygger på de samme data og
// regler som ugeplanen (slotForDate, gennemførte sessioner, rykkede dage).
function renderToday(sRaw, lRaw, personKey, sbdStatus){
  const el = document.getElementById('slot-today');
  if(!el) return;
  const todayStr = localISO(new Date());
  const now = new Date();
  const weekdayIdx = now.getDay();
  const slot = slotForDate(todayStr, getScheduleAnchor(), personKey) || { sbd:null, lob:null };
  const lobPlan = personKey==='ellen'
    ? (ELLEN_LOB_WEEKDAYS.has(weekdayIdx) ? { easy: !!slot.sbd } : null)
    : slot.lob;
  const sbdDone = sbdCompletedByDate(sRaw)[todayStr];
  const lobRuns = lobCompletedByDate(lRaw)[todayStr];
  const blocked = getBlockedDates(personKey).includes(todayStr);
  const catchup = getCatchupDates(personKey).includes(todayStr);
  const onboarded = !!(lRaw && lRaw.profile && lRaw.profile.onboarded);
  const dateLabel = now.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
  const items = [];

  // ── Styrke ──
  if(sbdDone){
    items.push(`<div class="today-item"><div class="today-kind">🏋️ Styrke <span class="week-day-tag tag-done">Gennemført</span></div>
      <div class="today-name">${sbdDone.short}</div>
      <div class="today-meta today-done">✓ Dagens styrketræning er klaret.</div></div>`);
  } else if(blocked || catchup){
    items.push(`<div class="today-item"><div class="today-kind">🏋️ Styrke <span class="week-day-tag tag-rest">Ikke muligt</span></div>
      <div class="today-name">Rykket</div>
      <div class="today-meta">${blocked ? 'Styrke er rykket én dag frem — løb er uændret.' : 'Styrke indhentes: næste ikke-styrkedag droppes. Løb er uændret.'}</div>
      <div class="today-actions"><a class="today-btn ghost" href="#slot-schedule" onclick="document.getElementById('slot-schedule').scrollIntoView({behavior:'smooth'});return false;">Se ugeplanen</a></div></div>`);
  } else if(slot.sbd && sbdStatus){
    const d = sbdStatus.day;
    const isRestDay = d.type==='rest';
    const ctx = sbdStatus.deload ? 'Deload-uge' : (sbdStatus.isTest ? 'Test/peak-uge' : `Blok ${sbdStatus.block}`);
    items.push(`<div class="today-item"><div class="today-kind">🏋️ Styrke <span class="week-day-tag tag-planned">${slot.sbd.optional?'Valgfri':'I dag'}</span></div>
      <div class="today-name">${isRestDay ? 'Pause' : (d.short || d.name)}</div>
      <div class="today-meta">${isRestDay ? 'Trackeren står på en pausedag.' : (d.desc || d.name)}<br><span style="color:var(--muted)">Uge ${sbdStatus.week}/${sbdStatus.totalWeeks} · ${ctx}${slot.sbd.optional?' · spring over hvis du er for træt':''}</span></div>
      <div class="today-actions"><a class="today-btn" href="./sbd/index.html">Åbn SBD-tracker</a></div></div>`);
  }

  // ── Løb ──
  if(lobRuns && lobRuns.length){
    const km = lobRuns.reduce((a,r)=>a+r.distanceKm,0);
    items.push(`<div class="today-item"><div class="today-kind">🏃 Løb <span class="week-day-tag tag-done">Gennemført</span></div>
      <div class="today-name">${km.toFixed(1)} km</div>
      <div class="today-meta today-done">✓ Dagens løb er logget.</div></div>`);
  } else if(lobPlan){
    const ex = lobExtrasFor(personKey);
    let title = 'Løb', lines = '';
    if(onboarded){
      const info = lobPhaseInfo(lRaw.profile.seasonStart);
      title = lobPlan.easy ? 'Let løb' : (info.isDeload ? 'Deload' : info.phase);
      if(ex.plan){
        title = ex.plan.title ? shortPlanText(ex.plan.title) : title;
        lines = (ex.plan.distance ? `<div>📏 <b>${shortPlanText(ex.plan.distance)}</b></div>` : '')
              + (ex.plan.pace ? `<div>🎯 ${shortPlanText(ex.plan.pace)}</div>` : '');
      } else if(lobPlan.easy && ex.easy){
        lines = `<div>Typisk: <b>${ex.easy.easyKm ? '~'+ex.easy.easyKm+' km' : ''}</b>${ex.easy.easyKm && ex.easy.easyPace ? ' · ' : ''}${ex.easy.easyPace || ''}</div>`;
      } else {
        lines = `<div>${lobPlan.easy ? 'Zone 1-2 — ligger tæt på en bendag.' : (LOB_PHASE_DESC[info.phase] || '')}</div>`;
      }
    } else {
      lines = '<div>Gennemfør opsætningen i løbe-trackeren for fase og intensitet.</div>';
    }
    items.push(`<div class="today-item"><div class="today-kind">🏃 Løb <span class="week-day-tag tag-planned">I dag</span></div>
      <div class="today-name">${title}</div>
      <div class="today-meta">${lines}</div>
      <div class="today-actions"><a class="today-btn ${items.length?'ghost':''}" href="./lob/index.html">Åbn løbe-tracker</a></div></div>`);
  }

  const gap = lobPlanGap(lRaw);
  const gapHtml = gap
    ? `<div class="today-warn" role="status">⚠️ <span><b>${gap.daysSince} dage</b> siden sidste løbetur — planen er ikke justeret for pausen. <a href="./lob/index.html">Åbn løbe-trackeren</a> for at skubbe planen eller beholde den.</span></div>`
    : '';

  let body;
  if(items.length){
    body = `<div class="today-items ${items.length>1?'two':''}">${items.join('')}</div>`;
  } else {
    body = `<div class="today-rest">😴 Hviledag — ingen planlagt træning. Næste pas står i ugeplanen herunder.</div>`;
  }
  const allDone = items.length>0 && items.every(h=>h.includes('tag-done'));
  el.innerHTML = `<div class="today-hero">
    <div class="today-head"><h2>${allDone ? 'Klaret i dag ✓' : 'I dag'}</h2><div class="today-date">${dateLabel}</div></div>
    ${gapHtml}${body}</div>`;
}

function renderSchedule(sRaw, lRaw, personKey){
  const anchor=getScheduleAnchor();
  const dates=computeWeekDates(scheduleWeekOffset);
  const jsWeekdayForIndex=i=>[1,2,3,4,5,6,0][i];
  const todayStr=localISO(new Date());
  const sbdDone=sbdCompletedByDate(sRaw);
  const lobDone=lobCompletedByDate(lRaw);
  const pattern=patternForPerson(personKey);
  const lobExtras=lobExtrasFor(personKey);
  const isTestWeek = sRaw ? (Math.min(12,Math.floor((sRaw.totalDays||0)/7)+1)===12) : false;
  let sbdCursor = sRaw ? (sRaw.totalDays||0) : 0; // bruges kun for slots uden fast cycleId

  let rows='';
  dates.forEach((dateStr,i)=>{
    const weekdayIdx=jsWeekdayForIndex(i);
    const isToday=dateStr===todayStr;
    const isFuture=dateStr>todayStr;
    const dayLabel=DAY_NAMES[weekdayIdx];
    const slot=slotForDate(dateStr,anchor,personKey) || { sbd:null, lob:null };
    const isBlocked=getBlockedDates(personKey).includes(dateStr);
    const isCatchup=getCatchupDates(personKey).includes(dateStr);
    // Ellen: løb er faste ugedage (hendes krav), uafhængigt af den rullende
    // cyklus. Let løb hvis det falder sammen med en SBD-dag (kombi), ellers
    // kvalitet/tempo.
    const lobPlan = personKey==='ellen'
      ? (ELLEN_LOB_WEEKDAYS.has(weekdayIdx) ? { easy: !!slot.sbd } : null)
      : slot.lob;

    let sbdCell;
    if(sbdDone[dateStr]){
      const c=sbdDone[dateStr];
      sbdCell=`<span class="week-day-tag tag-done">Gennemført</span> <div class="week-day-badge">🏋️ ${c.short}</div><div class="week-day-sub">${c.type==='rest'?'Hviledag':(c.desc||'')}</div>`;
    } else if((isFuture||isToday) && isBlocked){
      sbdCell=`<span class="week-day-tag tag-rest">🚫 Ikke muligt</span><div class="week-day-sub">Styrke rykket én dag frem — løb uændret</div><button class="day-picker-btn" style="margin-top:8px;width:100%;" onclick="toggleBlockedDate('${personKey}','${dateStr}')">Fortryd</button>`;
    } else if((isFuture||isToday) && isCatchup){
      sbdCell=`<span class="week-day-tag tag-rest">🚫 Ikke muligt</span><div class="week-day-sub">Styrke indhentes — næste ikke-styrkedag droppes, så du løfter 2 dage i træk. Løb er uændret</div><button class="day-picker-btn" style="margin-top:6px;width:100%;" onclick="toggleCatchupDate('${personKey}','${dateStr}')">Fortryd</button>`;
    } else if((isFuture||isToday) && slot.sbd && !isTestWeek && sRaw){
      let proj;
      if(slot.sbd.cycleId){
        proj = SBD_CYCLE.find(c=>c.id===slot.sbd.cycleId) || SBD_CYCLE[0];
      } else {
        // Ingen fast cycleId — følg det faktiske fremskridt i den ægte cyklus,
        // og spring pause-slots over (de er løb i dette mønster).
        do { proj = SBD_CYCLE[sbdCursor % 8]; sbdCursor++; } while(proj.type==='rest');
      }
      const tag = slot.sbd.optional ? 'Valgfri' : (isToday?'I dag':'Planlagt');
      const optNote = slot.sbd.optional ? '<div class="week-day-sub">Spring over hvis du er for træt</div>' : (proj.desc?`<div class="week-day-sub">${proj.desc}</div>`:'');
      sbdCell=`<span class="week-day-tag tag-planned">${tag}</span> <div class="week-day-badge">🏋️ ${proj.short}</div>${optNote}<details class="skip-menu"><summary>Kan ikke i dag?</summary><button class="day-picker-btn" onclick="toggleCatchupDate('${personKey}','${dateStr}')">Styrke ikke mulig — indhent (drop næste pause)</button><button class="day-picker-btn" onclick="toggleBlockedDate('${personKey}','${dateStr}')">Styrke ikke mulig — ryk styrke én dag</button></details>`;
    } else if((isFuture||isToday) && !slot.sbd && !lobPlan){
      sbdCell=`<span class="week-day-tag tag-rest">😴 Hviledag</span>`;
    } else {
      sbdCell=`<span class="week-day-tag tag-rest">—</span>`;
    }

    let lobCell;
    const lobRuns=lobDone[dateStr];
    if(lobRuns && lobRuns.length){
      const totalKm=lobRuns.reduce((a,r)=>a+r.distanceKm,0);
      lobCell=`<span class="week-day-tag tag-done">Gennemført</span> <div class="week-day-badge">🏃 ${totalKm.toFixed(1)} km</div>`;
    } else if((isFuture||isToday) && lobPlan && !(lRaw && lRaw.profile && lRaw.profile.onboarded)){
      // Løbe-trackeren er ikke onboardet endnu — vis dagen alligevel, så
      // rytmens løbedage er synlige fra start.
      lobCell=`<span class="week-day-tag tag-planned">${isToday?'I dag':'Planlagt'}</span> <div class="week-day-badge">🏃 ${lobPlan.easy?'Let løb':'Løb'}</div><div class="week-day-sub">Gennemfør opsætningen i løbe-trackeren for fase og intensitet</div>`;
    } else if((isFuture||isToday) && lobPlan && lRaw && lRaw.profile && lRaw.profile.onboarded){
      const info=lobPhaseInfo(lRaw.profile.seasonStart);
      const badge=lobPlan.easy ? 'Let' : (info.isDeload?'Deload':info.phase);
      const sub=lobPlan.easy ? '<div class="week-day-sub">Zone 1-2 — ligger tæt på en bendag</div>' : '';
      lobCell=`<span class="week-day-tag tag-planned">${isToday?'I dag':'Planlagt'}</span> <div class="week-day-badge">🏃 ${badge}</div>${sub}${lobDetailHtml(lobPlan,isToday,lobExtras)}`;
    } else {
      lobCell=`<span class="week-day-tag tag-rest">—</span>`;
    }

    const noSbd = /^<span class="week-day-tag tag-rest">—<\/span>$/.test(sbdCell);
    const noLob = /^<span class="week-day-tag tag-rest">—<\/span>$/.test(lobCell);
    rows+=`<div class="week-day-row ${isToday?'today':''} ${(!isToday && !isFuture)?'is-past':''}"${isToday?' aria-current="date"':''}>
      <div class="week-day-name">${dayLabel}</div>
      <div class="week-day-content${noSbd?' is-none':''}">${sbdCell}</div>
      <div class="week-day-content${noLob?' is-none':''}">${lobCell}</div>
    </div>`;
  });

  const gapNote = '';

  const rangeFmt = d => new Date(d+'T00:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'});
  const weekLabel = scheduleWeekOffset===0 ? 'Denne uge' : (scheduleWeekOffset===1 ? 'Næste uge' : (scheduleWeekOffset===-1 ? 'Sidste uge' : `${rangeFmt(dates[0])} – ${rangeFmt(dates[6])}`));

  document.getElementById('slot-schedule').innerHTML=`
    <div class="section-card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="scheduleShiftWeek(-1)" aria-label="Forrige uge">‹</button>
        <div class="cal-title">${weekLabel}<div style="font-size:10px;color:var(--muted);font-weight:400;text-transform:none;">${rangeFmt(dates[0])} – ${rangeFmt(dates[6])}</div></div>
        <button class="cal-nav-btn" onclick="scheduleShiftWeek(1)" aria-label="Næste uge">›</button>
      </div>
      ${gapNote}
      <div class="week-grid">${rows}</div>
      <details class="schedule-settings">
        <summary class="settings-summary">Rytme &amp; indstillinger</summary>

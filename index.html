// ═══════════════ V3 FASE 3: SAMLET KALENDER + HYBRID BELASTNING ═══════════════
// Bygger oven på slotForDate/renderSchedule-logikken (samme data, samme blokerede dage). Ændringer ligger som overlay i tp_meta.planChanges.
const HYB = { weekOffset: 0, sel: null, showDismissed: false, opts: {}, msg: '' };
const HYB_SBD_FLAGS = { cst1:{lower:false}, low1:{lower:true}, bb1:{lower:true,hinge:true}, cst2:{lower:false}, low2:{lower:true}, bb2:{lower:true,hinge:true} };
function hybProfileKey(personKey){ return personKey==='ellen' ? 'partner' : 'main'; }
function hybMeta(personKey){ return TP.loadMeta(hybProfileKey(personKey)); }
function hybFocus(meta){ return TPPLAN.engineFocus(meta); } // hypertrofi bruger styrke-reglerne (beskytter styrkepas)
function hybMedianKm(lRaw){
  const km=((lRaw&&lRaw.runs)||[]).slice(-12).map(r=>+r.distanceKm||0).filter(x=>x>0).sort((a,b)=>a-b);
  return km.length ? km[Math.floor(km.length/2)] : 0;
}
// Bygger dagene (gennemført + planlagt + overlay). extraChanges/extraBlocked bruges til "hvad nu hvis"-forhåndsvisning.
function hybBuild(personKey, sRaw, lRaw, extraChanges, extraBlocked, dropChangeId){
  const today=localISO(new Date()), anchor=getScheduleAnchor();
  const from=TP.addDays(TP.weekStart(today),-28), n=63;
  const blocked=getBlockedDates(personKey).concat(extraBlocked||[]), catchup=getCatchupDates(personKey);
  const meta=hybMeta(personKey);
  const changes=(meta.planChanges||[]).filter(c=>c.id!==dropChangeId).concat((extraChanges||[]).map((c,i)=>Object.assign({id:'x'+i},c)));
  const sbdDone=sbdCompletedByDate(sRaw), lobDone=lobCompletedByDate(lRaw);
  const maxHR=lRaw&&lRaw.profile?lRaw.profile.maxHR:0, med=hybMedianKm(lRaw);
  const prof=lRaw&&lRaw.profile?lRaw.profile:null;
  const raceDateISO=prof&&prof.raceGoal&&prof.raceGoal.active&&prof.raceGoal.date?prof.raceGoal.date:null;
  const lobDeloadAt=d=>{ if(!prof||!prof.seasonStart) return false; const wk=Math.max(1,Math.floor(TP.diffDays(prof.seasonStart,d)/7)+1); return wk%4===0; };
  const isTest=sRaw?(Math.min(12,Math.floor((sRaw.totalDays||0)/7)+1)===12):false;
  const deloadWeeks=(sRaw&&sRaw.deloadWeeks)||[];
  const heavyOk = personKey!=='ellen'; // Ellens styrke er tilbehør uden tunge hovedløft → aldrig "tung benstyrke"
  const mkSbd=(c,status,deload,optional)=>{
    // Type + belastning kommer fra programmets egen cyklus (TPPLAN.SBD_KINDS): tung hovedløft vs. teknik (3×3 ~60–65 % uden backdown). Ellen/deload → aldrig tung.
    const fl=TPPLAN.sbdFlags(c.id,{deload,heavyOk});
    return { id:'sbd-'+c.id+'-'+status, kind:'sbd', status, label:c.short+(deload?' (deload)':''), cycleId:c.id, lower:fl.lower, hinge:fl.hinge, hard:fl.hard, mainLift:fl.mainLift, role:fl.role, lowerLoad:fl.lowerLoad, legHyp:fl.legHyp, moderateLower:fl.moderateLower, kindLabel:fl.kindLabel, optional:!!optional, desc:c.desc||'' };
  };
  const slotMap=slotMapForRange(from,TP.addDays(from,n),anchor,personKey,blocked,catchup);
  // Planlagte styrkedage: samme cursor-logik som renderSchedule
  const plannedSbd={}, skipped={}; let cursor=sRaw?(sRaw.totalDays||0):0;
  for(let i=0;i<n;i++){
    const date=TP.addDays(from,i); if(date<today) continue;
    if(sbdDone[date]) continue;
    if(blocked.includes(date)||catchup.includes(date)){ skipped[date]=true; continue; }
    const slot=slotMap[date]||{sbd:null,lob:null};
    if(slot.sbd && !isTest && sRaw){
      let proj; do { proj=SBD_CYCLE[cursor%8]; cursor++; } while(proj.type==='rest');
      const wk=Math.min(12,Math.floor((cursor-1)/7)+1);
      plannedSbd[date]={ proj, optional:!!slot.sbd.optional, deload:(wk===4||wk===8||deloadWeeks.includes(wk)) };
    }
  }
  const doneFn=date=>{
    const out=[];
    const c=sbdDone[date]; if(c && c.type!=='rest') out.push(mkSbd(c,'done',false,false));
    (lobDone[date]||[]).forEach(r=>{ const k=P_classify(r,maxHR,med,raceDateISO); out.push({ id:'run-'+r.id, kind:'run', status:'done', label:(+r.distanceKm).toFixed(1)+' km', km:+r.distanceKm, hard:k.hard, long:k.long, load:k.load, runKind:k.kind, kindLabel:k.kindLabel, basis:k.basis, confidence:k.confidence, limits:k.limits, runId:r.id }); });
    return out;
  };
  const plannedFn=date=>{
    if(date<today) return [];
    const out=[]; const wdIdx=new Date(date+'T12:00:00').getDay();
    if(skipped[date]) out.push({ id:'sbd-skip', kind:'sbd', status:'skipped', label:'Styrke (ikke muligt)', lower:false, hard:false });
    else if(plannedSbd[date]) out.push(mkSbd(plannedSbd[date].proj,'planned',plannedSbd[date].deload,plannedSbd[date].optional));
    if(!(lobDone[date]&&lobDone[date].length)){
      const slot=slotMap[date]||{sbd:null,lob:null};
      const lobPlan = personKey==='ellen' ? (ELLEN_LOB_WEEKDAYS.has(wdIdx)?{easy:!!slot.sbd}:null) : slot.lob;
      if(lobPlan){
        const dl=lobDeloadAt(date);
        if(lobPlan.easy) out.push({ id:'run-plan-'+date, kind:'run', status:'planned', label:'Let løb', hard:false, long:false, load:'easy', runKind:'easy', kindLabel:'Roligt løb', basis:'Planlagt som let løb', confidence:'middel', limits:[] });
        else {
          // Type udledes af løbeplanens fase (samme logik som løb-appen bruger dagen før) — et skøn, markeret med lav sikkerhed.
          const pk=TPPLAN.plannedRunKind(TPPLAN.phaseFor(prof,date));
          out.push({ id:'run-plan-'+date, kind:'run', status:'planned', label:dl?'Løb (deload)':'Kvalitetsløb', hard:!!pk.hard&&!dl, long:!!pk.long&&!dl, load:(dl?'easy':pk.load), runKind:dl?'easy':pk.kind, kindLabel:dl?'Roligt løb (deload-uge)':pk.kindLabel, basis:dl?'Deload-uge i løbeplanen':pk.basis, confidence:pk.confidence, limits:pk.limits });
        }
      }
    }
    return out;
  };
  const race = prof&&prof.raceGoal&&prof.raceGoal.active&&prof.raceGoal.date ? prof.raceGoal : null;
  const goalDates={}; ((prof&&prof.goals)||[]).forEach(g=>{ if(g.deadline&&!g.achievedDate) (goalDates[g.deadline]=goalDates[g.deadline]||[]).push(g); });
  const markersFn=date=>{
    const m=[];
    if(race&&race.date===date) m.push({type:'race',label:'Løb'+(race.distance?' '+race.distance+' km':'')});
    (goalDates[date]||[]).forEach(()=>m.push({type:'goal',label:'Måldato'}));
    if(prof&&prof.seasonStart&&new Date(date+'T12:00:00').getDay()===1&&lobDeloadAt(date)) m.push({type:'deload',label:'Deload-uge (løb)'});
    return m;
  };
  return TPPLAN.buildDays({ from, days:n, doneFn, plannedFn, markersFn, changes });
}
function P_classify(r,maxHR,med,raceDate){ return TPPLAN.classifyRun(r,{maxHR,medianKm:med,raceDate}); }

function hybAnalyzeCtx(personKey,sRaw,lRaw,meta){
  const today=localISO(new Date());
  const runKm={}, sbdSets={};
  ((lRaw&&lRaw.runs)||[]).forEach(r=>{ const w=TP.weekStart(r.date); runKm[w]=(runKm[w]||0)+(+r.distanceKm||0); });
  if(sRaw){
    const st=sRaw.sessionTimes||{};
    (sRaw.completedDays||[]).forEach(d=>{
      const t=st['day'+d]; const ts=t?(t.end||t.start):null; if(!ts) return;
      const w=TP.weekStart(localISO(new Date(ts))); const log=(sRaw.logs||{})['day'+d]; if(!log) return;
      let sets=0; (log.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>{ if(s.done&&parseFloat(s.kg)>0) sets++; }));
      sbdSets[w]=(sbdSets[w]||0)+sets;
    });
  }
  // Selvrapporterede svar (styrke + løb) — de seneste 6 samlet efter tid
  const evs=[];
  if(sRaw&&sRaw.sessionEval) Object.keys(sRaw.sessionEval).forEach(k=>evs.push(sRaw.sessionEval[k]));
  ((lRaw&&lRaw.runs)||[]).forEach(r=>{ if(r.eval) evs.push(r.eval); });
  evs.sort((a,b)=>(a.ts||0)-(b.ts||0));
  const prof=lRaw&&lRaw.profile; const races=[];
  if(prof&&prof.raceGoal&&prof.raceGoal.active&&prof.raceGoal.date) races.push({date:prof.raceGoal.date,label:'Løb'});
  return { today, weekly:{runKm,sbdSets}, evalPattern:TP.evalPattern(evs.slice(-6)), dismissed:meta.dismissed||{}, races };
}
function hybCtx(personKey,sRaw,lRaw){
  const meta=hybMeta(personKey), today=localISO(new Date());
  const analyzeCtx=hybAnalyzeCtx(personKey,sRaw,lRaw,meta);
  const prof=lRaw&&lRaw.profile; const raceDate=analyzeCtx.races[0]&&analyzeCtx.races[0].date;
  const near=TPPLAN.attachedDates(meta,(prof&&prof.goals)||[],raceDate).concat(raceDate?[raceDate]:[]);
  const days=hybBuild(personKey,sRaw,lRaw);
  const findings=TPPLAN.analyze(days,analyzeCtx).filter(f=>{
    const last=f.dates[f.dates.length-1]; return last>=TP.addDays(today,-3);
  });
  return { meta, today, analyzeCtx, days, findings,
    sugCtx:{ today, analyzeCtx, focus:hybFocus(meta), runsFixed:personKey==='ellen',
      raceNear:d=>near.some(x=>TP.diffDays(d,x)>=0 && TP.diffDays(d,x)<=14),
      rebuild:(extra,blocked)=>hybBuild(personKey,sRaw,lRaw,extra,blocked) } };
}

// ── Kalender (uge) ──
function hybShiftWeek(d){ HYB.weekOffset=Math.max(-3,Math.min(3,HYB.weekOffset+d)); HYB.sel=null; HYB.msg=''; render(); }
function hybToday(){ HYB.weekOffset=0; HYB.sel=localISO(new Date()); render(); }
function hybSelect(date){ HYB.sel=HYB.sel===date?null:date; HYB.msg=''; render(); }
function hybItemChip(it){
  const icon=it.kind==='sbd'?'🏋️':'🏃';
  const st=it.status==='done'?'done':(it.status==='skipped'?'skip':'plan');
  const extra=(it.movedFrom?' ↪':'')+(it.easied?' ↓':'')+(it.optional?' (valgfri)':'');
  const tag=it.status==='done'?'✓ ':(it.status==='skipped'?'⤫ ':'');
  return `<span class="hy-chip ${st} ${it.kind}${it.hard&&it.status!=='done'?' hard':''}">${icon} ${tag}${esc2(it.label)}${extra}</span>`;
}
function esc2(t){ return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderHybridCalendar(sRaw,lRaw,personKey){
  const el=document.getElementById('slot-hybrid-cal'); if(!el) return;
  if(!window.TPPLAN||!window.TP){ el.innerHTML=''; return; }
  const keepTo=(document.getElementById('hy-to')||{}).value||'', keepFor=HYB.sel;
  try{
    const cx=hybCtx(personKey,sRaw,lRaw), today=cx.today;
    const wk=TP.addDays(TP.weekStart(today),HYB.weekOffset*7), dates=[0,1,2,3,4,5,6].map(i=>TP.addDays(wk,i));
    const by={}; cx.days.forEach(d=>by[d.date]=d);
    const conflictDates={}; TPPLAN.visible(cx.findings).forEach(f=>{ if(f.level==='warn') f.dates.forEach(d=>conflictDates[d]=true); });
    const label=HYB.weekOffset===0?'Denne uge':(HYB.weekOffset===1?'Næste uge':(HYB.weekOffset===-1?'Sidste uge':TPPLAN.fmtDate(dates[0])+' – '+TPPLAN.fmtDate(dates[6])));
    let cells='';
    dates.forEach(date=>{
      const d=by[date]||{items:[],markers:[]}; const isToday=date===today;
      const chips=d.items.map(hybItemChip).join('');
      const marks=d.markers.map(m=>`<span class="hy-mark ${m.type}">${m.type==='race'?'🏁':(m.type==='goal'?'🎯':'↓')} ${esc2(m.label)}</span>`).join('');
      const rest=!d.items.length&&date>=today?'<span class="hy-rest">Hviledag</span>':(!d.items.length?'<span class="hy-rest">—</span>':'');
      const summary=TPPLAN.dayName(date)+' '+date.slice(8,10)+'. '+(d.items.map(i=>(i.kind==='sbd'?'styrke ':'løb ')+i.label+(i.status==='done'?' gennemført':(i.status==='skipped'?' sprunget over':' planlagt'))).join(', ')||'hviledag')+(conflictDates[date]?'. Mulig konflikt':'');
      cells+=`<button type="button" class="hy-day${isToday?' today':''}${HYB.sel===date?' sel':''}${conflictDates[date]?' warn':''}${date<today?' past':''}" aria-pressed="${HYB.sel===date}" aria-label="${esc2(summary)}" onclick="hybSelect('${date}')">
        <span class="hy-dn">${TPPLAN.dayName(date)} <b>${date.slice(8,10)}</b>${conflictDates[date]?' <span class="hy-warn" title="Mulig konflikt">⚠</span>':''}</span>${marks}${chips}${rest}</button>`;
    });
    const changes=(cx.meta.planChanges||[]);
    const staleIds=cx.days.stale||[];
    const clist=changes.length?`<details class="hy-changes"><summary>Dine ændringer (${changes.length})</summary>${changes.slice().reverse().map(c=>`<div class="hy-chg"><span>${esc2(TPPLAN.describe(c))}${staleIds.includes(c.id)?' <em>(ikke længere gældende)</em>':''}</span><button type="button" class="hy-btn small" onclick="hybUndo('${c.id}')">Fortryd</button></div>`).join('')}</details>`:'';
    el.innerHTML=`<div class="section-card hy-card">
      <div class="cal-nav"><button class="cal-nav-btn" onclick="hybShiftWeek(-1)" aria-label="Forrige uge">‹</button>
        <div class="cal-title">${label}<div style="font-size:10px;color:var(--muted);font-weight:400;text-transform:none;">${TPPLAN.fmtDate(dates[0])} – ${TPPLAN.fmtDate(dates[6])}</div></div>
        <button class="cal-nav-btn" onclick="hybShiftWeek(1)" aria-label="Næste uge">›</button></div>
      <div class="hy-week" role="group" aria-label="Ugens træning">${cells}</div>
      <div class="hy-legend"><span class="hy-chip plan sbd">🏋️ Styrke</span><span class="hy-chip plan run">🏃 Løb</span><span class="hy-chip done run">✓ Gennemført</span><span class="hy-chip skip run">⤫ Sprunget over</span><span>↪ flyttet · ↓ gjort let · ⚠ mulig konflikt</span>
        <button type="button" class="hy-btn small" onclick="hybToday()">I dag</button></div>
      ${HYB.msg?`<div class="hy-msg" role="status">${esc2(HYB.msg)}</div>`:''}
      ${HYB.sel?hybDetail(HYB.sel,cx,personKey,sRaw,lRaw):'<div class="deferred-note">Tryk på en dag for detaljer. Intet ændres uden din bekræftelse.</div>'}
      ${clist}
    </div>`;
    // En baggrunds-gentegning (fx løbe-prognosen) må ikke slette brugerens valgte flyttedag
    if(keepTo&&keepFor&&keepFor===HYB.sel){ const sel=document.getElementById('hy-to'); if(sel&&[...sel.options].some(o=>o.value===keepTo)){ sel.value=keepTo; hybPreview(HYB.sel); } }
  }catch(e){ el.innerHTML='<div class="section-card"><div class="deferred-note">Kalenderen kunne ikke vises ('+esc2(e.message)+').</div></div>'; }
}
function hybDetail(date,cx,personKey,sRaw,lRaw){
  const d=cx.days.find(x=>x.date===date); if(!d) return '';
  const fs=TPPLAN.visible(cx.findings).filter(f=>f.dates.includes(date));
  let h=`<div class="hy-detail" id="hy-detail" tabindex="-1"><h4>${TPPLAN.fmtDate(date)}${date===cx.today?' · i dag':''}</h4>`;
  d.markers.forEach(m=>{ h+=`<div class="hy-note">${m.type==='race'?'🏁':(m.type==='goal'?'🎯':'↓')} ${esc2(m.label)}</div>`; });
  if(!d.items.length) h+='<div class="hy-note">Hviledag — intet planlagt.</div>';
  d.items.forEach(it=>{
    h+=`<div class="hy-item">${hybItemChip(it)}`;
    if(it.desc) h+=`<div class="hy-note">${esc2(it.desc)}</div>`;
    if(it.kind==='run'&&it.kindLabel) h+=`<div class="hy-note">Type: ${esc2(it.kindLabel)}${it.basis?' — '+esc2(it.basis):''} (sikkerhed: ${esc2(it.confidence||'—')})</div>`;
    if(it.kind==='sbd'&&it.kindLabel) h+=`<div class="hy-note">Belastning: ${esc2(it.kindLabel)}</div>`;
    if(it.optional) h+='<div class="hy-note">Valgfri — spring over hvis du er for træt.</div>';
    if(it.movedFrom) h+=`<div class="hy-note">Flyttet fra ${TPPLAN.fmtDate(it.movedFrom)}.</div>`;
    if(it.status==='done'){
      h+=`<div class="hy-note">Gennemført og registreret i ${it.kind==='sbd'?'SBD-appen':'Løb-appen'}.</div>`;
    } else if(it.status==='planned'&&date>=cx.today){
      if(it.kind==='run'&&!it.movedFrom) h+=hybRunActions(date,it,cx,personKey);
      else if(it.kind==='run') h+=`<div class="hy-note">Flyttet løb — fortryd flytningen under "Dine ændringer" for at ændre igen.</div>`;
      if(it.kind==='sbd') h+=hybSbdActions(date,it,cx,personKey);
      h+=`<a class="hy-btn small" href="${it.kind==='sbd'?'sbd/index.html':'lob/index.html'}">Åbn ${it.kind==='sbd'?'SBD':'Løb'}-appen og registrér</a>
        <div class="hy-note">Gennemførelse registreres i appen (ét sted), så historik og progression aldrig dobbeltregistreres.</div>`;
    } else if(it.status==='skipped'){
      h+=`<div class="hy-note">Styrke rykket én dag frem via "Kan ikke i dag". Fortryd under "Dine ændringer", hvis det blev gjort her.</div>`;
    }
    h+='</div>';
  });
  if(fs.length) h+=`<div class="hy-note warn">⚠ ${fs.length} mulig(e) konflikt(er) denne dag — se "Hybrid belastning" nedenfor for forklaring og forslag.</div>`;
  h+='</div>';
  return h;
}
function hybRunActions(date,it,cx,personKey){
  const fixed=personKey==='ellen';
  const opts=[]; for(let i=0;i<=13;i++){ const t=TP.addDays(cx.today,i); if(t===date) continue; const day=cx.days.find(x=>x.date===t); if(!day) continue; if(day.items.some(x=>x.kind==='run'&&x.status!=='skipped')) continue; opts.push(t); }
  let h='<div class="hy-actions">';
  if(!fixed) h+=`<label class="hy-lbl" for="hy-to">Flyt til</label><select id="hy-to" class="hy-sel" onchange="hybPreview('${date}')"><option value="">Vælg dag…</option>${opts.map(t=>`<option value="${t}">${TPPLAN.fmtDate(t)}</option>`).join('')}</select>`;
  else h+='<div class="hy-note">Ellens løbedage er faste (hendes krav) — flytning er slået fra. Du kan gøre dagen let eller springe den over.</div>';
  h+=`<div id="hy-prev" class="hy-prev" aria-live="polite"></div>
    <div class="hy-row">${fixed?'':`<button type="button" class="hy-btn" id="hy-apply-move" disabled onclick="hybApplyMove('${date}')">Flyt løbet</button>`}
    ${it.hard?`<button type="button" class="hy-btn" onclick="hybPreview('${date}','easy')">Gør roligt løb…</button>`:''}
    <button type="button" class="hy-btn" onclick="hybPreview('${date}','skiprun')">Spring over…</button></div></div>`;
  return h;
}
function hybSbdActions(date,it,cx,personKey){
  return `<div class="hy-actions"><div id="hy-prev" class="hy-prev" aria-live="polite"></div>
    <div class="hy-row"><button type="button" class="hy-btn" onclick="hybPreview('${date}','skipsbd')">Kan ikke i dag…</button></div></div>`;
}
// Forhåndsvisning af konsekvens: sammenlign advarsler før/efter
function hybPreview(date,mode){
  const {sRaw,lRaw,personKey}=hybCurrent(); const cx=hybCtx(personKey,sRaw,lRaw);
  const prev=document.getElementById('hy-prev'); if(!prev) return;
  const sel=document.getElementById('hy-to'); let change=null, blocked=[], text='', apply=null;
  if(mode==='easy'){ change={type:'easyRun',date}; text='Dagens hårde løb bliver et roligt løb (zone 1–2). Ugens kvalitetsløb udgår — det kan påvirke løbemål lidt.'; apply='hybApplyChange(\''+date+'\',\'easy\')'; }
  else if(mode==='skiprun'){ change={type:'skipRun',date}; text='Løbet springes over denne dag. Det flyttes ikke automatisk.'; apply='hybApplyChange(\''+date+'\',\'skiprun\')'; }
  else if(mode==='skipsbd'){ blocked=[date]; change={type:'skipSbd',date}; text='Bruger den eksisterende "Kan ikke i dag": styrkedagene rykkes én dag frem. Rækkefølgen — og dermed programmet og progressionen — er uændret.'; apply='hybApplyChange(\''+date+'\',\'skipsbd\')'; }
  else { const to=sel&&sel.value; const btn=document.getElementById('hy-apply-move'); if(btn) btn.disabled=!to; if(!to){ prev.innerHTML=''; return; } change={type:'moveRun',from:date,to}; text='Kun løbet flyttes til '+TPPLAN.fmtDate(to)+'. Styrkeprogrammet, cyklus og progression påvirkes ikke.'; }
  const before=TPPLAN.analyze(cx.days,cx.analyzeCtx).filter(f=>!f.dismissed&&f.level==='warn');
  const afterDays=hybBuild(personKey,sRaw,lRaw,change.type==='skipSbd'?[]:[change],blocked);
  const after=TPPLAN.analyze(afterDays,cx.analyzeCtx).filter(f=>!f.dismissed&&f.level==='warn');
  const bk=before.map(f=>f.key), ak=after.map(f=>f.key);
  const gone=before.filter(f=>!ak.includes(f.key)), added=after.filter(f=>!bk.includes(f.key));
  let h=`<div class="hy-note">${esc2(text)}</div>`;
  h+=`<div class="hy-note"><b>Konsekvens:</b> ${before.length} → ${after.length} advarsler.</div>`;
  if(gone.length) h+=`<div class="hy-note ok">Løses: ${gone.map(f=>esc2(f.title)).join('; ')}</div>`;
  if(added.length) h+=`<div class="hy-note warn">Ny(e) advarsel/advarsler: ${added.map(f=>esc2(f.title)).join('; ')}</div>`;
  if(!gone.length&&!added.length) h+='<div class="hy-note">Ingen ændring i advarsler.</div>';
  if(apply) h+=`<button type="button" class="hy-btn primary" onclick="${apply}">Bekræft</button> <button type="button" class="hy-btn" onclick="hybSelectKeep()">Annullér</button>`;
  prev.innerHTML=h;
}
function hybSelectKeep(){ render(); }
function hybCurrent(){
  const personKey=localStorage.getItem('dash_profile')||'oliver'; const p=PROFILES[personKey];
  const sbdWho=p.primary[0]==='sbd'?p.primary[1]:p.secondary[1], lobWho=p.primary[0]==='lob'?p.primary[1]:p.secondary[1];
  return { personKey, sRaw:readSbdRaw(sbdWho), lRaw:readLobRaw(lobWho) };
}
function hybCommit(personKey,meta,msg){
  if(!TP.saveMeta(hybProfileKey(personKey),meta)){ HYB.msg='Kunne ikke gemme ændringen (lager fuldt eller blokeret). Intet er ændret.'; return false; }
  HYB.msg=msg; return true;
}
function hybApplyMove(from){
  const {personKey}=hybCurrent(); const to=(document.getElementById('hy-to')||{}).value; if(!to) return;
  const meta=hybMeta(personKey); TPPLAN.addChange(meta,TPPLAN.newChange({type:'moveRun',from,to}));
  hybCommit(personKey,meta,'Løbet er flyttet. Brug "Fortryd" under "Dine ændringer" for at rulle tilbage.'); render();
}
function hybApplyChange(date,mode){
  const {personKey}=hybCurrent(); const meta=hybMeta(personKey);
  if(mode==='skipsbd'){
    TPPLAN.addChange(meta,TPPLAN.newChange({type:'skipSbd',date}));
    if(!hybCommit(personKey,meta,'Styrke rykket én dag frem. Brug "Fortryd" for at rulle tilbage.')){ render(); return; }
    if(!getBlockedDates(personKey).includes(date)) toggleBlockedDate(personKey,date); else render();
    return;
  }
  TPPLAN.addChange(meta,TPPLAN.newChange(mode==='easy'?{type:'easyRun',date}:{type:'skipRun',date}));
  hybCommit(personKey,meta,mode==='easy'?'Løbet er gjort til et roligt løb.':'Løbet er sprunget over.'); render();
}
function hybUndo(id){
  const {personKey}=hybCurrent(); const meta=hybMeta(personKey); const c=(meta.planChanges||[]).find(x=>x.id===id); if(!c) return;
  TPPLAN.removeChange(meta,id);
  if(!hybCommit(personKey,meta,'Ændringen er fortrudt: '+TPPLAN.describe(c))){ render(); return; }
  if(c.type==='skipSbd'&&getBlockedDates(personKey).includes(c.date)){ toggleBlockedDate(personKey,c.date); return; }
  render();
}

// ── Hybrid belastning ──
function hybDismiss(key,action){
  const {personKey}=hybCurrent(); const meta=hybMeta(personKey); meta.dismissed=meta.dismissed||{}; meta.dismissed[key]={at:Date.now(),action};
  hybCommit(personKey,meta,action==='rejected'?'Markeret som ikke relevant.':'Ignoreret.'); render();
}
function hybRestore(key){
  const {personKey}=hybCurrent(); const meta=hybMeta(personKey); if(meta.dismissed) delete meta.dismissed[key]; meta.dismissTombs=meta.dismissTombs||{}; meta.dismissTombs[key]=Date.now();
  hybCommit(personKey,meta,'Vist igen.'); render();
}
function hybToggleDismissed(){ HYB.showDismissed=!HYB.showDismissed; render(); }
function hybApplyOption(key,i){
  const o=(HYB.opts[key]||[])[i]; if(!o) return; const {personKey}=hybCurrent(); const meta=hybMeta(personKey);
  const c=o.change; if(!c) return;
  if(c.type==='skipSbd'){
    TPPLAN.addChange(meta,TPPLAN.newChange({type:'skipSbd',date:c.date}));
    if(!hybCommit(personKey,meta,'Forslag anvendt: '+TPPLAN.describe(c))){ render(); return; }
    if(!getBlockedDates(personKey).includes(c.date)) toggleBlockedDate(personKey,c.date); else render();
    return;
  }
  { const cc=Object.assign({},c); delete cc.id; TPPLAN.addChange(meta,TPPLAN.newChange(cc)); }
  hybCommit(personKey,meta,'Forslag anvendt: '+TPPLAN.describe(c)+'. Fortryd under "Dine ændringer".'); render();
}

const FOCUS_ORDER = ['balanced','strength','hypertrophy','run'];
const GOAL_KIND_LABEL = { weekKm:'Km pr. uge', monthKm:'Km pr. måned', yearKm:'Km i år', longest:'Længste tur (km)', weekRuns:'Løbeture pr. uge', streak:'Streak (uger)', time:'Tid på distance', pace:'Snittempo' };
function focusGoalChoices(sRaw,lRaw){
  const out=[];
  ['sq','bp','dl'].forEach(k=>out.push({ id:'sbd:'+k, label:LIFT_LABEL[k]+'-mål (programmet)', kind:'strength' }));
  if(lRaw&&lobGoal(lRaw)) out.push({ id:'vdot', label:'VDOT-forbedring', kind:'run' });
  const rg=lRaw&&lRaw.profile&&lRaw.profile.raceGoal;
  if(rg&&rg.active&&rg.date) out.push({ id:'race', label:'Løbsmål'+(rg.distance?' '+rg.distance+' km':'')+' · '+TPPLAN.fmtDate(rg.date), kind:'run' });
  ((lRaw&&lRaw.profile&&lRaw.profile.goals)||[]).forEach(g=>{ if(g&&g.id&&!g.achievedDate) out.push({ id:g.id, label:'Løbemål: '+(GOAL_KIND_LABEL[g.kind]||'Mål')+(g.target?' '+g.target:'')+(g.deadline?' · deadline '+TPPLAN.fmtDate(g.deadline):''), kind:'run' }); });
  return out;
}

// ── Månedsrapport ──
const RPT = { ym:null, cache:{}, msg:'' };
function rptNow(){ return localISO(new Date()).slice(0,7); }
function rptFirstMonth(sRaw,lRaw){
  let first=rptNow();
  const sd=sbdCompletedByDate(sRaw); Object.keys(sd).forEach(d=>{ if(d.slice(0,7)<first) first=d.slice(0,7); });
  ((lRaw&&lRaw.runs)||[]).forEach(r=>{ if(r.date&&r.date.slice(0,7)<first) first=r.date.slice(0,7); });
  return first;
}
// Planlagt ud fra rytmen — kun hvis ankeret ligger før månedens start (ellers kendes planen ikke)
function rptPlanned(personKey,ym){
  const rg=TPREPORT.monthRange(ym), anchor=getScheduleAnchor(); if(anchor>rg.first) return null;
  const m=slotMapForRange(rg.first,rg.last,anchor,personKey); let sbd=0, run=0;
  for(let i=0;i<rg.days;i++){
    const ds=TP.addDays(rg.first,i), sl=m[ds]; if(!sl) continue; if(sl.sbd) sbd++;
    const wd=new Date(ds+'T12:00:00').getDay();
    const lp=personKey==='ellen'?(ELLEN_LOB_WEEKDAYS.has(wd)?{easy:!!sl.sbd}:null):sl.lob; if(lp) run++;
  }
  return { sbd, run };
}
function rptSignature(sRaw,lRaw,meta){
  const runs=(lRaw&&lRaw.runs)||[]; const ev=sRaw&&sRaw.sessionEval?Object.keys(sRaw.sessionEval).length:0;
  return [(sRaw&&sRaw.completedDays||[]).length, runs.length, runs.length?runs[runs.length-1].id:'', ev, runs.filter(r=>r.eval).length, TPPLAN.focusKey(meta), getScheduleAnchor(), getBlockedDates(localStorage.getItem('dash_profile')||'oliver').length].join('|');
}
function rptBuild(personKey,sRaw,lRaw,meta,ym,force){
  const key=personKey+'|'+ym+'|'+rptSignature(sRaw,lRaw,meta);
  const snap=meta.reports&&meta.reports[ym];
  if(snap&&!force&&ym<rptNow()) return { rep:snap, snapshot:true };
  if(!force&&RPT.cache[key]) return { rep:RPT.cache[key], snapshot:false };
  const rep=TPREPORT.build({ sbd:sRaw, lob:lRaw, profile:hybProfileKey(personKey), planned:rptPlanned(personKey,ym), focus:TPPLAN.focusKey(meta), today:localISO(new Date()) },ym,Date.now());
  RPT.cache[key]=rep; return { rep, snapshot:false };
}
function rptShift(d){ RPT.ym=d>0?TPREPORT.nextMonth(RPT.ym):TPREPORT.prevMonth(RPT.ym); RPT.msg=''; render(); }
function rptSaveSnapshot(force){
  const {personKey,sRaw,lRaw}=hybCurrent(); const meta=hybMeta(personKey);
  const b=rptBuild(personKey,sRaw,lRaw,meta,RPT.ym,true); meta.reports=meta.reports||{}; meta.reports[RPT.ym]=b.rep;
  RPT.msg=TP.saveMeta(hybProfileKey(personKey),meta)?'Rapporten er gemt som snapshot. Den kan åbnes igen senere, også hvis data ændres.':'Kunne ikke gemme rapporten (lager fuldt eller blokeret).'; render();
}
function rptGo(ym){ RPT.ym=ym; RPT.msg=''; render(); }
function rptCurrentReport(){ const {personKey,sRaw,lRaw}=hybCurrent(); return rptBuild(personKey,sRaw,lRaw,hybMeta(personKey),RPT.ym,false).rep; }
function rptDownload(kind){
  const rep=rptCurrentReport(); const html=kind==='html'; const data=html?TPREPORT.toHtml(rep):TPREPORT.toText(rep);
  const blob=new Blob([data],{type:html?'text/html;charset=utf-8':'text/plain;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='maanedsrapport-'+rep.month+(html?'.html':'.txt'); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function rptPrint(){
  const rep=rptCurrentReport(); const f=document.createElement('iframe'); f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(f); const d=f.contentWindow.document; d.open(); d.write(TPREPORT.toHtml(rep)); d.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(),2000); },250);
}
function rptStmt(x){ return `<li>${esc2(x.text)}${x.rule?` <small class="rp-rule">[${esc2(x.rule)}]</small>`:''}${x.basis.length?`<details class="rp-basis"><summary>Grundlag</summary>${x.basis.map(b=>`<div>${esc2(b[0])}: <b>${esc2(b[1])}</b></div>`).join('')}</details>`:''}</li>`; }
function rptBlock(title,cls,arr){ return `<div class="rp-block ${cls}"><h4>${title}</h4>${arr.length?`<ul>${arr.map(rptStmt).join('')}</ul>`:'<div class="hy-note">—</div>'}</div>`; }
function renderMonthReport(sRaw,lRaw,personKey){
  const el=document.getElementById('slot-report'); if(!el) return;
  if(!window.TPREPORT||!window.TPPLAN||!window.TP){ el.innerHTML=''; return; }
  try{
    const meta=hybMeta(personKey), now=rptNow(), first=rptFirstMonth(sRaw,lRaw);
    if(!RPT.ym||RPT.ym>now) RPT.ym=now;
    const {rep,snapshot}=rptBuild(personKey,sRaw,lRaw,meta,RPT.ym,false);
    const snaps=Object.keys(meta.reports||{}).sort().reverse();
    const c=rep.conclusion, f=v=>v==null?'—':v;
    const vc=rep.overall.volumeChange;
    el.innerHTML=`<div class="section-card hy-card"><div class="cal-nav"><button class="cal-nav-btn" onclick="rptShift(-1)" aria-label="Forrige måned" ${RPT.ym<=first?'disabled':''}>‹</button>
      <div class="cal-title">${esc2(rep.label)}<div style="font-size:10px;color:var(--muted);font-weight:400;text-transform:none;">${rep.partial?'Måneden er ikke slut — foreløbige tal':'Afsluttet måned'}</div></div>
      <button class="cal-nav-btn" onclick="rptShift(1)" aria-label="Næste måned" ${RPT.ym>=now?'disabled':''}>›</button></div>
      <div class="rp-badge">Regelbaseret opsummering — ingen AI. Hvert udsagn kan spores til tallene under "Grundlag".</div>
      ${snapshot?`<div class="hy-note">Gemt snapshot fra ${new Date(rep.generatedAt).toISOString().slice(0,10)}. Data kan være ændret siden. <button type="button" class="hy-btn small" onclick="rptSaveSnapshot(true)">Genberegn og gem</button></div>`:''}
      <div class="rp-grid">
        <div class="rp-card"><h4>Styrke</h4><div>${rep.strength.sessions} pas (${rep.strength.perWeek}/uge)</div><div>${rep.strength.sets} arbejdssæt</div><div>Tonnage ${rep.strength.tonnage} kg</div>${Object.keys(rep.strength.lifts).map(k=>{const l=rep.strength.lifts[k]; return `<div class="hy-note">${esc2(l.label)}: ${l.monthBest!=null?l.monthBest+' kg e1RM':'—'}${l.priorBest!=null?' (før: '+l.priorBest+')':''}</div>`;}).join('')}</div>
        <div class="rp-card"><h4>Løb</h4><div>${rep.running.runs} ture · ${rep.running.km} km</div><div>Snit ${rep.running.avgKm} km · længste ${(+rep.running.longestKm).toFixed(1)} km</div>${rep.running.paceSecPerKm?`<div>Snit-tempo ${TPREPORT.fmtPace(rep.running.paceSecPerKm)}</div>`:''}</div>
        <div class="rp-card"><h4>Samlet</h4><div>${rep.overall.sessions} pas på ${rep.overall.trainingDays} dage</div>${rep.overall.planned?`<div>Planlagt ${rep.overall.planned.total} · gennemført ${rep.overall.planned.completed}</div>`:'<div class="hy-note">Planlagt kendes ikke for hele måneden</div>'}<div>Fordeling: ${f(rep.overall.split.strengthPct)} % styrke / ${f(rep.overall.split.runPct)} % løb</div><div class="hy-note">Ændring vs. forrige: pas ${vc.sessions==null?'—':(vc.sessions>0?'+':'')+vc.sessions+' %'} · km ${vc.km==null?'—':(vc.km>0?'+':'')+vc.km+' %'}</div></div>
        <div class="rp-card"><h4>Selvvurdering <small>(selvrapporteret)</small></h4>${rep.evaluation.n?`<div>${rep.evaluation.n} svar${rep.evaluation.avgEffort!=null?' · snit anstrengelse '+rep.evaluation.avgEffort+'/10':''}</div><div class="hy-note">Hårdere: ${rep.evaluation.harder} · som ventet: ${rep.evaluation.as} · lettere: ${rep.evaluation.easier}</div>`:'<div class="hy-note">Ingen svar i måneden</div>'}</div>
      </div>
      ${rptBlock('Hvad gik godt','good',c.good)}${rptBlock('Hvad udviklede sig','dev',c.developed)}${rptBlock('Hvad gik tilbage','bad',c.regressed)}${rptBlock('Fokus næste måned','focus',c.focus)}
      <div class="hy-row" style="margin-top:12px;"><button type="button" class="hy-btn" onclick="rptDownload('html')">Hent som HTML</button><button type="button" class="hy-btn" onclick="rptDownload('txt')">Hent som tekst</button><button type="button" class="hy-btn" onclick="rptPrint()">Print / PDF</button>${(!snapshot)?`<button type="button" class="hy-btn" onclick="rptSaveSnapshot()">Gem som snapshot</button>`:''}</div>
      ${RPT.msg?`<div class="hy-msg" role="status">${esc2(RPT.msg)}</div>`:''}
      ${snaps.length?`<details class="hy-changes"><summary>Tidligere gemte rapporter (${snaps.length})</summary><div class="hy-row" style="margin-top:6px;">${snaps.map(m=>`<button type="button" class="hy-btn small" onclick="rptGo('${m}')">${esc2(TPREPORT.monthLabel(m))}</button>`).join('')}</div></details>`:''}
      <details class="hy-rules"><summary>Regler bag konklusionerne</summary><ul>${TPREPORT.RULES.map(r=>`<li><b>${esc2(r.id)}</b> — ${esc2(r.text)}</li>`).join('')}</ul></details>
    </div>`;
  }catch(e){ el.innerHTML='<div class="section-card"><div class="deferred-note">Månedsrapporten kunne ikke vises ('+esc2(e.message)+').</div></div>'; }
}

const PROFILES = {
  oliver: { label:'Oliver', primary:['sbd','main'], secondary:['lob','main'] },
  ellen:  { label:'Ellen',  primary:['lob','partner'], secondary:['sbd','partner'] },
};

function readStatus(discipline, who){
  return discipline === 'sbd' ? readSbd(who) : readLob(who);
}

function render(){
  const active = localStorage.getItem('dash_profile') || 'oliver';
  document.getElementById('btn-oliver').classList.toggle('active', active==='oliver');
  document.getElementById('btn-ellen').classList.toggle('active', active==='ellen');
  document.getElementById('btn-oliver').setAttribute('aria-pressed', active==='oliver');
  document.getElementById('btn-ellen').setAttribute('aria-pressed', active==='ellen');
  document.getElementById('topbar-sub').textContent = 'Dit program';

  const p = PROFILES[active];
  const primaryStatus = readStatus(p.primary[0], p.primary[1]);
  const secondaryStatus = readStatus(p.secondary[0], p.secondary[1]);

  document.getElementById('label-primary').textContent = `Primær — ${DISC_META[p.primary[0]].label}`;
  document.getElementById('label-secondary').textContent = `Sekundær — ${DISC_META[p.secondary[0]].label}`;

  document.getElementById('slot-primary').innerHTML = renderCard(primaryStatus, p.primary[0], 'primary');
  document.getElementById('slot-secondary').innerHTML = renderCard(secondaryStatus, p.secondary[0], 'secondary');

  // Rå data for denne person, uanset hvilken disciplin der er primær/sekundær
  const sbdWho = p.primary[0]==='sbd' ? p.primary[1] : p.secondary[1];
  const lobWho = p.primary[0]==='lob' ? p.primary[1] : p.secondary[1];
  const sRaw = readSbdRaw(sbdWho);
  const lRaw = readLobRaw(lobWho);

  renderToday(sRaw, lRaw, active, readSbd(sbdWho));
  renderOversigt(sRaw, lRaw);
  renderSchedule(sRaw, lRaw, active);
  renderHybridCalendar(sRaw, lRaw, active);
  renderAttempts(sRaw);
  renderStyrke(sRaw);
  renderVolumen(sRaw);
  renderHeatmap(sRaw);
  renderBlockProgressionSection(sRaw);
  renderWeeklyVerdictSection(sRaw);
  renderLobUge(lRaw);
  renderLobKondition(lRaw);
  renderLobRekorder(lRaw);
  renderRecovery(sRaw);
  renderKrop(sRaw);
  renderBelastning(sRaw, lRaw);
  renderHybridLoad(sRaw, lRaw, active);
  renderMal(sRaw, lRaw);
  renderFocusPanel(sRaw, lRaw, active);
  renderMonthReport(sRaw, lRaw, active);
  renderPR(sRaw, lRaw);
  renderInsights(sRaw, lRaw);
  renderSettings();
}

function setProfile(name){
  localStorage.setItem('dash_profile', name);
  render();
}

// V3.1: ÉN fælles implementering (tp-sync.js) bruges af dashboard, SBD og løb. Dashboardet synkroniserer nu også sine V3-brugerdata
// (planændringer, afviste forslag, fokus, "ikke mulig"-dage, rytme-anker) som tp_meta_*. Konflikter får et synligt valg (banner).
// Sæt din egen Worker-URL her efter deploy (se sync-worker/DEPLOY.md).
const SYNC_BASE_URL = 'https://oliver-training-sync.olivercyka.workers.dev';
const TPS = TPSYNC.boot(SYNC_BASE_URL);
function syncEnabled(){ return TPS.enabled(); }
// Data hentet fra en anden enhed → gen-render (event udsendes af motoren)
TPS.on(function(ev){ if(ev.type==='changed'){ try{ render(); }catch(e){ console.log('Gen-render efter sync fejlede:', e); } } });

// Dagens løbeforslag regnes kun i lob/index.html. Mangler dagens forslag, loader vi
// løbeappen usynligt (samme origin, deler localStorage) så den gemmer forslaget,
// og gen-renderer dashboardet — ingen duplikeret logik.
function refreshLobPlanIfNeeded(){
  try{
    const today = localISO(new Date());
    const raw = JSON.parse(localStorage.getItem('lob_state'));
    if(!raw || !raw.profile || !raw.profile.onboarded) return;
    if(raw.notFeeling100 && raw.notFeeling100[today]) return;
    const active = localStorage.getItem('lob_active_profile') || 'main';
    const p = JSON.parse(localStorage.getItem('lob_today_plan_'+active) || 'null');
    const gsum = JSON.parse(localStorage.getItem('lob_goals_summary_'+active) || 'null');
    const hasGoals = Array.isArray(raw.profile.goals) && raw.profile.goals.length > 0;
    if(p && p.date === today && ('pace' in p) && localStorage.getItem('lob_easy_summary_'+active) &&  (!hasGoals || (gsum && gsum.date === today))) return;
    if(document.getElementById('lob-plan-frame')) return;
    const f = document.createElement('iframe');
    f.id = 'lob-plan-frame';
    f.src = './lob/index.html';
    f.setAttribute('aria-hidden','true');
    f.tabIndex = -1;
    f.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden;';
    f.onload = function(){
      setTimeout(function(){
        render();
        if(f.parentNode) f.parentNode.removeChild(f);
      }, 1500);
    };
    document.body.appendChild(f);
  }catch(e){ console.log('Løbeforslag kunne ikke opdateres:', e); }
}

async function boot(){
  registerSW();
  render(); // vis lokale data med det samme
  refreshLobPlanIfNeeded();
  startReminderLoop();
  await TPS.syncAll(); // henter nyere data (og sender evt. ventende offline-ændringer); 'changed'-event gen-renderer
}
boot();
